<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Social Studies Champions: a classroom team trivia game. Spin the wheel, win crowns, and collect all five characters.">
<meta name="theme-color" content="#2b1156">
<meta property="og:title" content="Social Studies Champions">
<meta property="og:description" content="Collect the characters. Conquer the knowledge.">
<meta property="og:type" content="website">
<meta property="og:image" content="social-card.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png" type="image/png">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Social Studies Champions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout concept: a violet arena. The wheel sits dead centre and the teams ring it —
   left and right, then below, then the four corners — so every team faces the board. */
:root{
  --bg-1:#2b1156; --bg-2:#1a0834; --bg-3:#3a1a6e;
  --panel:rgba(255,255,255,.08); --panel-2:rgba(255,255,255,.13); --panel-3:rgba(0,0,0,.22);
  --line:rgba(255,255,255,.16); --line-2:rgba(255,255,255,.3);
  --ink:#ffffff; --ink-2:#d9cdf2; --ink-3:#a593cf;
  --gold:#ffc83d; --gold-2:#ffb01f; --gold-ink:#3d2600;
  --good:#2ddc84; --good-ink:#06351d; --bad:#ff5d7a; --bad-ink:#3d0412;
  --c-history:#f5a623; --c-geography:#2d9cdb; --c-civics:#27ae60;
  --c-economics:#f2c94c; --c-culture:#eb5ba8; --c-crown:#9b51e0;
  --r-s:12px; --r-m:18px; --r-l:26px; --r-xl:34px;
  --sh:0 10px 30px rgba(10,2,28,.45);
  --sh-lg:0 22px 60px rgba(10,2,28,.6);
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0;min-height:100%;font-family:var(--f-body);color:var(--ink);font-size:16px;line-height:1.45;
  background:
    radial-gradient(900px 620px at 50% -10%, var(--bg-3) 0%, transparent 60%),
    radial-gradient(700px 500px at 12% 104%, #5b2a9e 0%, transparent 58%),
    radial-gradient(620px 460px at 92% 90%, #7a2fae 0%, transparent 58%),
    linear-gradient(180deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1320px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;text-wrap:balance;letter-spacing:.2px}
p{margin:0}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.spacer{flex:1 1 auto;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.eyebrow{font-family:var(--f-body);font-size:11.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.3px;
  color:var(--gold-ink);background:linear-gradient(180deg,var(--gold),var(--gold-2));
  border:0;border-radius:999px;padding:14px 26px;box-shadow:0 6px 0 #c47f00,var(--sh);
  transition:transform .1s ease,box-shadow .1s ease,filter .15s ease}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c47f00,var(--sh)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.lg{font-size:19px;padding:17px 36px}
.btn.sm{font-size:14px;padding:9px 16px;box-shadow:0 4px 0 #c47f00}
.btn.sm:active{box-shadow:0 1px 0 #c47f00}
.btn.block{width:100%}
.btn.ghost{color:#fff;background:var(--panel-2);box-shadow:0 4px 0 rgba(0,0,0,.28),var(--sh)}
.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.ghost:hover{background:rgba(255,255,255,.2)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;
  border-radius:50%;border:1px solid var(--line);background:var(--panel);color:#fff;font-size:17px;
  cursor:pointer;transition:background .15s,transform .12s}
.icon-btn:hover{background:var(--panel-2)}
.icon-btn:active{transform:scale(.93)}
.icon-btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.icon-btn.on{background:var(--gold);color:var(--gold-ink);border-color:transparent}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh);padding:22px;backdrop-filter:blur(6px)}
.card.flat{background:var(--panel-3);box-shadow:none}
.card.tight{padding:15px;border-radius:var(--r-m)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;
  font-size:13.5px;font-weight:800;background:var(--panel-2);border:1px solid var(--line)}
.chip.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;padding:4px 9px;border-radius:7px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ink-2)}
.tag.cat{background:var(--cc);color:#1b0a2e;border-color:transparent}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding-block:16px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:18px;font-weight:600}
.brand span{color:var(--gold)}

/* ---------- character art ---------- */
.ctile{position:relative;display:grid;place-items:center;aspect-ratio:1/1;min-width:0;overflow:hidden}
.ctile img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
.ctile.dim img{filter:grayscale(1) brightness(.5) opacity(.4)}
.ctile.framed{background:var(--panel-3);border:1px solid var(--line);border-radius:14px;padding:4px}
.ctile.on.framed{background:color-mix(in srgb,var(--cc) 22%,transparent);border-color:var(--cc)}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:10px 52px;text-align:center}
.logo{font-family:var(--f-display);font-weight:700;line-height:1;letter-spacing:.5px}
.logo .l1{display:block;font-size:clamp(30px,6.6vw,66px);color:#fff;
  text-shadow:0 4px 0 #3a1a6e,0 10px 26px rgba(0,0,0,.5)}
.logo .l2{display:block;font-size:clamp(30px,6.6vw,66px);color:var(--gold);
  text-shadow:0 4px 0 #a06b00,0 10px 26px rgba(255,180,40,.3)}
.tagline{font-size:clamp(15px,1.9vw,20px);font-weight:700;color:var(--ink-2)}
.cast{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(6px,1.2vw,16px);width:100%;max-width:980px}
@media (max-width:720px){.cast{grid-template-columns:repeat(3,1fr)}}
.cast figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.cast .ctile{width:100%;animation:bob 4.5s ease-in-out infinite}
.cast figure:nth-child(2) .ctile{animation-delay:.3s}
.cast figure:nth-child(3) .ctile{animation-delay:.6s}
.cast figure:nth-child(4) .ctile{animation-delay:.9s}
.cast figure:nth-child(5) .ctile{animation-delay:1.2s}
.cast figure:nth-child(6) .ctile{animation-delay:1.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.cast figcaption{font-family:var(--f-display);font-size:clamp(11px,1.3vw,15px);font-weight:600;color:var(--cc)}
.cast figcaption small{display:block;font-family:var(--f-body);font-size:10px;font-weight:800;
  letter-spacing:.08em;color:var(--ink-3);margin-top:1px}
.home-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.home-note{color:var(--ink-2);max-width:56ch;font-size:15px;font-weight:600}

/* ---------- forms ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.hint{font-size:13px;color:var(--ink-3);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font-family:var(--f-body);font-size:14px;font-weight:800;color:var(--ink-2);cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;transition:all .14s}
.seg button:hover{background:var(--panel-2);color:#fff}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.seg button:focus-visible{outline:3px solid #fff;outline-offset:2px}
input[type=text],textarea,select{font-family:var(--f-body);font-size:15px;font-weight:700;color:#fff;
  background:var(--panel-3);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;font-weight:400;min-height:190px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:transparent}
select option{background:#2b1156;color:#fff}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .12s}
.swatch[aria-pressed="true"]{border-color:#fff;transform:scale(1.15)}
.team-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:15px;border-radius:var(--r-m);
  background:var(--panel-3);border:1px solid var(--line);border-left:4px solid var(--tc)}
.team-row .field{flex:1 1 190px}

/* ---------- the arena: wheel in the middle, teams around it ---------- */
.arena{display:grid;gap:clamp(10px,1.6vw,20px);align-items:center;justify-items:center;
  grid-template-columns:minmax(0,210px) minmax(0,1fr) minmax(0,210px);
  grid-template-rows:auto auto auto;padding-bottom:30px}
.arena .center{grid-column:2;grid-row:2;width:100%;display:flex;flex-direction:column;
  align-items:center;gap:16px;min-width:0}
@media (max-width:940px){
  .arena{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
  .arena .center{grid-column:1/-1;grid-row:1}
  .arena .seat{grid-column:auto!important;grid-row:auto!important;width:100%}
}
.seat{width:100%;max-width:250px;justify-self:center}

/* wheel */
.wheel-stage{position:relative;width:min(100%,460px);aspect-ratio:1/1;display:grid;place-items:center;margin-inline:auto}
.wheel-rotor{width:100%;height:100%;transform:rotate(0deg)}
.wheel-rotor.spin{transition:transform 5.2s cubic-bezier(.13,.78,.1,1)}
.wheel-glow{position:absolute;inset:-8%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,200,61,.22),transparent 62%);filter:blur(14px)}
.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;
  border-left:17px solid transparent;border-right:17px solid transparent;border-top:30px solid #fff;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))}
.pointer.hit{animation:tick .45s cubic-bezier(.3,1.6,.4,1)}
@keyframes tick{0%{transform:translateX(-50%) rotate(0)}35%{transform:translateX(-50%) rotate(-16deg)}100%{transform:translateX(-50%) rotate(0)}}
.spin-hub{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;z-index:2;cursor:pointer;
  border:5px solid #fff;background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--gold-ink);
  font-family:var(--f-display);font-size:clamp(14px,2.2vw,22px);font-weight:700;letter-spacing:.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .12s}
.spin-hub:not([disabled]){animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.spin-hub:active:not([disabled]){transform:scale(.94)}
.spin-hub[disabled]{opacity:.55;cursor:default;animation:none}
.spin-hub:focus-visible{outline:3px solid #fff;outline-offset:4px}
.cat-reveal{display:flex;align-items:center;gap:14px;animation:popin .45s cubic-bezier(.2,1.5,.4,1) both}
.cat-reveal .ctile{width:92px}
.cat-reveal .nm{font-family:var(--f-display);font-size:clamp(20px,3vw,30px);font-weight:600;color:var(--cc)}
@keyframes popin{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* turn bar */
.turn-bar{width:100%;display:flex;align-items:center;gap:13px;flex-wrap:wrap;border-radius:999px;
  padding:11px 20px;background:linear-gradient(90deg,var(--tc),rgba(255,255,255,.08));
  border:1px solid var(--line);box-shadow:var(--sh)}
.turn-bar .who{font-family:var(--f-display);font-size:clamp(16px,2.1vw,22px);font-weight:600}

/* team seat card */
.team-card{width:100%;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--tc);
  border-radius:var(--r-m);padding:12px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.team-card.active{transform:translateY(-3px) scale(1.03);box-shadow:0 0 0 2px var(--gold),var(--sh-lg)}
.team-card .thead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.team-card .tname{font-family:var(--f-display);font-size:14.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.team-card .score{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.crown-meter{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.pips{display:flex;gap:3px}
.pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
.pip.on{background:var(--gold)}
.crown-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
  background:var(--gold);color:var(--gold-ink);font-weight:900;font-size:12px}

/* question */
.qcard{width:100%;max-width:880px;display:flex;flex-direction:column;gap:15px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--sh-lg);padding:clamp(16px,2.6vw,26px);backdrop-filter:blur(8px)}
.qhead{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.qhead .ctile{width:52px}
.qhead .cat{font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--cc)}
.timer-track{width:100%;height:10px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden}
.timer-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--good),var(--gold));transition:width .25s linear}
.timer-fill.warn{background:linear-gradient(90deg,var(--gold),var(--bad));animation:flash .7s infinite}
@keyframes flash{50%{opacity:.55}}
.qtext{font-family:var(--f-display);font-size:clamp(19px,2.6vw,30px);font-weight:600;line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:11px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;width:100%;
  font-family:var(--f-body);font-size:clamp(15px,1.6vw,17.5px);font-weight:800;color:#fff;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;
  transition:transform .1s,background .14s,border-color .14s}
.opt:hover:not([disabled]){background:rgba(255,255,255,.22);transform:translateY(-2px)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .key{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-display);font-size:15px;font-weight:600;background:rgba(0,0,0,.3)}
.opt.correct{background:var(--good);color:var(--good-ink);border-color:transparent;animation:popin .35s}
.opt.correct .key{background:rgba(0,0,0,.2)}
.opt.wrong{background:var(--bad);color:var(--bad-ink);border-color:transparent;animation:shake .4s}
.opt.wrong .key{background:rgba(0,0,0,.2)}
.opt.dim{opacity:.4}
.opt[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(6px)}}
.verdict{display:flex;align-items:center;gap:11px;border-radius:var(--r-m);padding:13px 17px;font-weight:900;
  animation:popin .3s both}
.verdict.ok{background:rgba(45,220,132,.18);border:1px solid var(--good);color:var(--good)}
.verdict.no{background:rgba(255,93,122,.18);border:1px solid var(--bad);color:var(--bad)}
.verdict .big{font-family:var(--f-display);font-size:clamp(17px,2vw,22px);font-weight:600}
.explain{background:var(--panel-3);border:1px solid var(--line);border-radius:var(--r-m);
  padding:14px 16px;font-size:15px;line-height:1.5;color:var(--ink-2);font-weight:600}
.explain b{color:#fff}

/* lifelines */
.lifelines{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:2px}
.lifelines .hint{flex:1 1 100%;margin-top:-4px}
.ll{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-family:var(--f-body);
  font-size:14px;font-weight:800;color:#fff;background:var(--panel-2);border:1px solid var(--line);
  border-radius:999px;padding:9px 16px;transition:transform .12s,background .14s,color .14s}
.ll:hover:not([disabled]){background:var(--gold);color:var(--gold-ink);border-color:transparent;transform:translateY(-2px)}
.ll:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ll[disabled]{opacity:.3;cursor:not-allowed}
.ll[disabled] .nm{text-decoration:line-through}
.ll .secs{font-variant-numeric:tabular-nums;opacity:.75}
.ll-mini{display:flex;gap:4px}
.ll-mini span{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:7px;
  background:rgba(255,255,255,.14);color:var(--ink-2)}
.ll-mini span.spent{opacity:.25}
.consult-num{font-family:var(--f-display);font-size:clamp(56px,15vw,120px);font-weight:700;line-height:1;
  color:var(--gold);font-variant-numeric:tabular-nums}
.consult-ring{width:100%;height:10px;border-radius:999px;background:rgba(0,0,0,.32);overflow:hidden}
.consult-ring i{display:block;height:100%;background:var(--gold);transition:width .25s linear}

/* crown pick */
.crown-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;width:100%;max-width:720px}
.pick-btn{display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;padding:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);transition:all .15s}
.pick-btn:hover:not([disabled]){border-color:var(--cc);transform:translateY(-4px);box-shadow:var(--sh-lg)}
.pick-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pick-btn[disabled]{opacity:.35;cursor:not-allowed}
.pick-btn .nm{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--cc)}
.pick-btn .got{font-size:11px;font-weight:800;color:var(--ink-3)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(14,4,32,.8);
  backdrop-filter:blur(7px);padding:max(18px,env(safe-area-inset-left,0px));animation:fade .22s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07));
  border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-lg);
  padding:clamp(20px,4vw,34px);max-width:460px;width:100%;display:flex;flex-direction:column;
  align-items:center;gap:14px;text-align:center;animation:sheetIn .45s cubic-bezier(.2,1.1,.3,1) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.sheet .hero{width:min(56vw,230px);animation:heroIn .65s cubic-bezier(.2,1.4,.35,1) both}
@keyframes heroIn{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
.rays{position:absolute;width:min(92vw,660px);aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(255,200,61,.3) 0 7deg,transparent 7deg 22deg);
  animation:spin360 11s linear infinite;
  mask-image:radial-gradient(circle,#000 16%,transparent 66%);
  -webkit-mask-image:radial-gradient(circle,#000 16%,transparent 66%)}
@keyframes spin360{to{transform:rotate(360deg)}}

/* victory */
.victory{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding-block:28px 52px}
.winner-name{font-family:var(--f-display);font-size:clamp(30px,6vw,60px);font-weight:700;color:var(--gold);
  text-shadow:0 5px 0 #a06b00,0 14px 30px rgba(0,0,0,.5)}
.winner-cast{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.5vw,16px);width:100%;max-width:700px}
.winner-cast .ctile{animation:bob 4s ease-in-out infinite}
.results{width:100%;max-width:780px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:500px}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:700}
th{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:900}
#confetti{position:fixed;inset:0;z-index:50;pointer-events:none}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:45;overflow-y:auto;
  background:linear-gradient(180deg,#3a1a6e,#1d0a3a);border-left:1px solid var(--line);
  box-shadow:-20px 0 60px rgba(0,0,0,.6);animation:slide .25s ease both;
  padding:18px max(18px,env(safe-area-inset-right,0px)) 44px 18px}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.drawer h3{font-family:var(--f-body);font-size:11.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:24px 0 11px}
.drawer h3:first-of-type{margin-top:12px}
.log-item{font-size:13px;padding:9px 11px;border-radius:10px;background:var(--panel-3);
  margin-bottom:6px;border-left:3px solid var(--lc);font-weight:600}

/* steps + bank */
.steps{display:grid;gap:17px}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-display);font-size:16px;font-weight:600;background:var(--gold);color:var(--gold-ink)}
.step h4{font-size:16px;margin:3px 0 2px}
.step p{color:var(--ink-2);font-size:14.5px;font-weight:600}
.bank-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.qrow{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cc);
  border-radius:var(--r-m);padding:14px}
.qrow .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.qrow .qq{font-weight:800;font-size:15.5px;line-height:1.35}
.qrow .ans{margin-top:7px;font-size:14px;font-weight:800;color:var(--good)}
.qrow .exp{margin-top:4px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.toolbar{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end}
.toolbar .field{flex:1 1 150px}
.empty{text-align:center;padding:46px 16px;color:var(--ink-3);font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--gold);
  color:var(--gold-ink);font-weight:900;font-size:14px;padding:12px 22px;border-radius:999px;
  box-shadow:var(--sh-lg);animation:popin .25s both}
.kbd{display:inline-block;font-family:ui-monospace,monospace;font-size:12px;background:var(--panel-3);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .wheel-rotor.spin{transition:transform .4s ease-out}
}

/* ============================ audio ============================ */
/* Music comes from real files dropped into audio/ — see the README. Anything missing just
   stays silent. The short cues are still synthesised so the game never waits on a download. */
var MUSIC_FILES={ menu:"audio/menu.mp3", board:"audio/board.mp3", quiz:"audio/question.mp3", victory:"audio/victory.mp3" };
/* a missing track borrows another: the play track covers the questions, the intro covers the rest */
var MUSIC_FALLBACK={ board:"menu", quiz:"board", victory:"menu" };
var A={ ctx:null, master:null, sfxOn:true, musicOn:true, vol:0.75, noise:null,
        players:{}, track:null, want:null, unlocked:false, preloaded:false };
function audioInit(){
  if(A.ctx!==null) return A.ctx;
  try{ A.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ A.ctx=false; return null; }
  A.master=A.ctx.createGain(); A.master.gain.value=A.vol; A.master.connect(A.ctx.destination);
  var len=A.ctx.sampleRate*0.5, buf=A.ctx.createBuffer(1,len,A.ctx.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  A.noise=buf;
  return A.ctx;
}
function player(name){
  if(A.players[name]!==undefined) return A.players[name];
  var src=MUSIC_FILES[name]; if(!src){ A.players[name]=null; return null; }
  var el=new Audio(src);
  el.loop=(name!=="victory"); el.preload="auto"; el.volume=0;
  el.addEventListener("error",function(){
    A.players[name]=null;                       /* file is not there: fall back and keep playing */
    if(A.track===name){ A.track=null; if(A.want) musicStart(A.want); }
  });
  A.players[name]=el;
  return el;
}
function fade(el,to,ms){
  if(!el) return;
  var from=el.volume, t0=performance.now();
  (function step(){
    var p=Math.min(1,(performance.now()-t0)/ms);
    try{ el.volume=clamp(from+(to-from)*p,0,1); }catch(e){}
    if(p<1) requestAnimationFrame(step);
    else if(to===0){ try{ el.pause(); }catch(e){} }
  })();
}
function musicStart(name){
  A.want=name;
  /* start fetching the moment a screen asks for a track, even before sound is unlocked,
     so the first note is not waiting on the download */
  if(!A.unlocked||!A.musicOn){ if(A.musicOn) preloadTrack(name); return; }
  var key=name;
  if(!player(key)) key=MUSIC_FALLBACK[name]||null;
  if(key&&!player(key)) key=null;
  if(A.track===key) return;
  if(A.track&&A.players[A.track]) fade(A.players[A.track],0,300);
  A.track=key;
  if(!key) return;
  var el=player(key);
  try{ if(!el.loop) el.currentTime=0; var p=el.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){}
  fade(el,A.vol*0.55,260);
}
function musicStop(){
  if(A.track&&A.players[A.track]) fade(A.players[A.track],0,400);
  A.track=null; A.want=null;
}
/* Fetch every track as soon as sound is unlocked. Switching mid-match then costs nothing,
   and a file that is not there reports its error long before anything asks for it. */
function preloadTrack(name){
  var el=player(name);
  if(!el) return;
  /* creating the element already starts the fetch; load() would abort and restart it */
  if(el.readyState===0&&el.networkState!==2){ try{ el.load(); }catch(e){} }
}
function preloadAll(){
  if(A.preloaded) return;
  A.preloaded=true;
  if(A.want) preloadTrack(A.want);          /* whatever is playing gets the bandwidth first */
  setTimeout(function(){
    Object.keys(MUSIC_FILES).forEach(function(n){ if(n!==A.want) preloadTrack(n); });
  },1500);
}
function audioResume(){
  audioInit();
  if(A.ctx&&A.ctx.state==="suspended"){ try{ A.ctx.resume(); }catch(e){} }
  if(!A.unlocked){
    A.unlocked=true;
    if(A.want) musicStart(A.want);
    preloadAll();
  }
}
function applyAudio(st){
  A.sfxOn=st.sfx; A.musicOn=st.music; A.vol=st.vol;
  if(A.master&&A.ctx) A.master.gain.setTargetAtTime(A.vol,A.ctx.currentTime,0.05);
  if(!A.musicOn){ if(A.track&&A.players[A.track]) fade(A.players[A.track],0,300); A.track=null; }
  else if(A.want) musicStart(A.want);
  else if(A.track&&A.players[A.track]) fade(A.players[A.track],A.vol*0.55,300);
}
function voice(type,f1,f2,t0,dur,peak,cutoff){
  var c=A.ctx; if(!c) return;
  var o=c.createOscillator(), g=c.createGain(), node=o;
  o.type=type; o.frequency.setValueAtTime(f1,t0);
  if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  if(cutoff){ var f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(cutoff,t0); o.connect(f); node=f; }
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  node.connect(g); g.connect(A.master);
  o.start(t0); o.stop(t0+dur+0.04);
}
function hiss(t0,dur,peak,hp){
  var c=A.ctx; if(!c||!A.noise) return;
  var s=c.createBufferSource(); s.buffer=A.noise;
  var f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp||5000;
  var g=c.createGain();
  g.gain.setValueAtTime(peak,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(A.master);
  s.start(t0); s.stop(t0+dur+0.02);
}
function sfx(name){
  if(!A.sfxOn) return; var c=audioInit(); if(!c) return;
  var t=c.currentTime;
  if(name==="click")      voice("sine",680,920,t,0.07,0.06,4000);
  else if(name==="tick")  voice("sine",1500,1500,t,0.04,0.05);
  else if(name==="land"){ voice("sine",700,1050,t,0.14,0.12,6000); hiss(t,0.09,0.05,4000); }
  else if(name==="good"){ [784,988,1319].forEach(function(f,i){ voice("sine",f,f,t+i*0.065,0.26,0.1,6000); }); }
  else if(name==="bad"){  voice("sine",330,180,t,0.3,0.09,1400); }
  else if(name==="riser"){ for(var i=0;i<18;i++) hiss(t+i*0.26,0.22,0.018+i*0.001,1200+i*260); }
  else if(name==="unlock"){ [659,880,1175,1568].forEach(function(f,i){ voice("sine",f,f,t+i*0.085,0.4,0.1,8000); }); }
  else if(name==="crown"){ [880,1175,1568,2093].forEach(function(f,i){ voice("sine",f,f,t+i*0.07,0.45,0.1,9000); }); }
  else if(name==="win"){ [523,659,784,1047,1319].forEach(function(f,i){ voice("sine",f,f,t+i*0.14,0.5,0.1,8000); }); }
}

/* ---- confetti ---- */
var confettiStop=0, confettiRunning=false;
function confetti(ms){
  var cv=document.getElementById("confetti"); if(!cv) return;
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.hidden=false;
  var ctx=cv.getContext("2d"), parts=[];
  function size(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
  size();
  var cols=["#ffc83d","#2d9cdb","#27ae60","#eb5ba8","#9b51e0","#ffffff"];
  for(var i=0;i<170;i++) parts.push({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.6,
    w:5+Math.random()*8, h:7+Math.random()*10,
    vy:2.4+Math.random()*3.6, vx:-1.6+Math.random()*3.2,
    r:Math.random()*Math.PI, vr:-0.16+Math.random()*0.32,
    c:cols[(Math.random()*cols.length)|0]
  });
  confettiStop=Date.now()+(ms||4200);
  if(confettiRunning) return;
  confettiRunning=true;
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<parts.length;i++){
      var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      if(p.y>cv.height+30){ p.y=-20; p.x=Math.random()*cv.width; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if(Date.now()<confettiStop) requestAnimationFrame(frame);
    else { ctx.clearRect(0,0,cv.width,cv.height); cv.hidden=true; confettiRunning=false; }
  })();
  window.addEventListener("resize",size);
}

/* ---- starfield ---- */
function Stars(){
  var ref=useRef(null);
  useEffect(function(){
    var cv=ref.current; if(!cv) return;
    var ctx=cv.getContext("2d"), stars=[], raf=0,
        reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function build(){
      cv.width=window.innerWidth; cv.height=window.innerHeight; stars=[];
      var n=Math.min(170,Math.round(cv.width*cv.height/12000));
      for(var i=0;i<n;i++) stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
        r:Math.random()*1.6+0.3,p:Math.random()*6.28,s:0.01+Math.random()*0.026});
    }
    build();
    function frame(){
      ctx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<stars.length;i++){
        var s=stars[i]; s.p+=s.s;
        ctx.globalAlpha=0.25+Math.abs(Math.sin(s.p))*0.65;
        ctx.fillStyle=i%8===0?"#ffd97a":"#ffffff";
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
      }
      ctx.globalAlpha=1;
      if(!reduce) raf=requestAnimationFrame(frame);
    }
    frame();
    window.addEventListener("resize",build);
    return function(){ cancelAnimationFrame(raf); window.removeEventListener("resize",build); };
  },[]);
  return html`<canvas id="stars" ref=${ref} aria-hidden="true"></canvas>`;
}

/* ============================ bank helpers ============================ */
function defaultBank(){ return clone(SEED); }
function loadBank(){
  var b=lsGet("ssc.bank",null);
  if(!b||!b.length) return defaultBank();
  var ok=b.filter(function(q){ return q&&typeof q.q==="string"&&q.o&&q.o.length===4&&CAT_BY_ID[q.cat]&&q.cat!=="crown"; });
  return ok.length?ok:defaultBank();
}
function poolFor(bank,s){
  var max=LEVEL_ORDER[s.level]; if(max===undefined) max=5;
  return bank.filter(function(q){
    var set=q.set||"general";
    if(s.set!=="all"&&set!==s.set) return false;
    if(set==="general"&&(LEVEL_ORDER[q.lvl]===undefined||LEVEL_ORDER[q.lvl]>max)) return false;
    if(s.difficulty!=="mixed"&&q.dif!==s.difficulty) return false;
    return true;
  });
}
var CSV_HEAD=["id","set","ref","topic","category","level","difficulty","question","a","b","c","d","answer","explanation"];
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(bank){
  var rows=[CSV_HEAD.join(",")];
  bank.forEach(function(q){
    rows.push([q.id,q.set||"general",q.ref||"",q.topic||"",q.cat,q.lvl,q.dif,q.q,
      q.o[0],q.o[1],q.o[2],q.o[3],"ABCD".charAt(q.a),q.e].map(csvCell).join(","));
  });
  return rows.join("\n");
}
function parseCSV(text){
  var rows=[],row=[],cur="",q=false,i=0;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(;i<text.length;i++){
    var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"'){ q=true; }
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.length>1||r[0]!==""; });
}
function normalize(o){
  if(!o) return null;
  var cat=String(o.cat||o.category||"").toLowerCase().trim();
  if(!CAT_BY_ID[cat]||cat==="crown") return null;
  var opts=o.o&&o.o.length?o.o:[o.a,o.b,o.c,o.d];
  opts=(opts||[]).map(function(x){ return String(x==null?"":x).trim(); });
  if(opts.length!==4||!opts.every(function(x){return x;})) return null;
  var a=o.answer; if(a===undefined||a===null||a===""){ a=o.a; }
  if(typeof a==="string"){ var l=a.trim().toUpperCase().charAt(0);
    a="ABCD".indexOf(l)>=0?"ABCD".indexOf(l):parseInt(a,10); }
  a=parseInt(a,10); if(isNaN(a)||a<0||a>3) return null;
  var text=String(o.q||o.question||"").trim(); if(!text) return null;
  var lvl=String(o.lvl||o.level||"8").trim().toUpperCase().replace("º","");
  if(LEVEL_ORDER[lvl]===undefined) lvl="8";
  var dif=String(o.dif||o.difficulty||"medium").toLowerCase().trim();
  if(DIFFS.indexOf(dif)<0) dif="medium";
  var set=String(o.set||"custom").toLowerCase().trim();
  if(!SET_BY_ID[set]) set="custom";
  return {id:o.id||uid(),set:set,ref:o.ref||"",topic:o.topic||"",cat:cat,lvl:lvl,dif:dif,
    q:text,o:opts,a:a,e:String(o.e||o.explanation||"").trim()};
}
function parseImport(text){
  text=(text||"").trim(); if(!text) return [];
  var out=[];
  if(text.charAt(0)==="["||text.charAt(0)==="{"){
    var data=JSON.parse(text);
    if(!Array.isArray(data)) data=data.questions||data.bank||[data];
    data.forEach(function(o){ var n=normalize(o); if(n) out.push(n); });
  } else {
    var rows=parseCSV(text); if(rows.length<2) return [];
    var head=rows[0].map(function(h){ return String(h).trim().toLowerCase(); });
    for(var i=1;i<rows.length;i++){
      var obj={}; head.forEach(function(h,j){ obj[h]=rows[i][j]; });
      var n=normalize(obj); if(n) out.push(n);
    }
  }
  return out;
}

/* ============================ game ============================ */
/* Seats ring the wheel: two face each other, a third sits below, a fourth set takes the corners. */
function seatStyle(i,n){
  var maps={
    2:[{gridColumn:1,gridRow:2},{gridColumn:3,gridRow:2}],
    3:[{gridColumn:1,gridRow:2},{gridColumn:3,gridRow:2},{gridColumn:2,gridRow:3}],
    4:[{gridColumn:1,gridRow:1},{gridColumn:3,gridRow:1},{gridColumn:1,gridRow:3},{gridColumn:3,gridRow:3}]
  };
  var m=maps[n]||maps[2];
  return m[i]||{gridColumn:1,gridRow:2};
}
function Game(props){
  var m=props.match, setM=props.setMatch, bank=props.bank;
  var s=m.settings, team=m.teams[m.turn];
  var st=useState(0), rot=st[0], setRot=st[1];
  var sp=useState(false), spinning=sp[0], setSpinning=sp[1];
  var ld=useState(false), landed=ld[0], setLanded=ld[1];
  var dr=useState(false), drawer=dr[0], setDrawer=dr[1];
  var to=useState(null), toast=to[0], setToast=to[1];
  var timers=useRef([]);
  useEffect(function(){ return function(){ timers.current.forEach(clearTimeout); }; },[]);
  function later(fn,ms){ var id=setTimeout(fn,ms); timers.current.push(id); return id; }

  useEffect(function(){
    if(m.phase==="question") musicStart("quiz");
    else if(m.phase==="victory") musicStart("victory");
    else musicStart("board");
  },[m.phase]);

  useEffect(function(){
    if(m.phase!=="question"||m.paused||m.consult) return;
    var iv=setInterval(function(){
      setM(function(p){
        if(p.phase!=="question"||p.paused||p.consult) return p;
        return Object.assign({},p,{timeLeft:Math.max(0,Math.round((p.timeLeft-0.25)*100)/100)});
      });
    },250);
    return function(){ clearInterval(iv); };
  },[m.phase,m.paused]);
  useEffect(function(){ if(m.phase==="question"&&m.timeLeft<=0) answer(null); },[m.phase,m.timeLeft]);
  useEffect(function(){
    if(m.phase==="question"&&!m.paused&&!m.consult&&m.timeLeft>0&&m.timeLeft<=5&&m.timeLeft%1===0) sfx("tick");
  },[m.timeLeft]);

  /* the "ask a rival" window runs on its own clock while the question clock waits */
  useEffect(function(){
    if(!m.consult||m.paused) return;
    var iv=setInterval(function(){
      setM(function(p){
        if(!p.consult||p.paused) return p;
        var left=Math.max(0,Math.round((p.consult.left-0.25)*100)/100);
        return Object.assign({},p,{consult:left<=0?null:{left:left,total:p.consult.total}});
      });
    },250);
    return function(){ clearInterval(iv); };
  },[!!m.consult,m.paused]);
  useEffect(function(){
    if(m.consult&&!m.paused&&m.consult.left>0&&m.consult.left<=5&&m.consult.left%1===0) sfx("tick");
  },[m.consult&&m.consult.left]);

  useEffect(function(){
    if(m.phase==="victory"||m.phase==="unlock"||m.pendingUnlock) return;
    for(var i=0;i<m.teams.length;i++){
      if(m.teams[i].unlocked.length>=CATS.length){
        sfx("win"); confetti(11000);
        setM(function(p){ return Object.assign({},p,{phase:"victory",winner:i,endedAt:Date.now()}); });
        return;
      }
    }
  },[m.teams,m.phase]);

  useEffect(function(){
    function onKey(ev){
      var tag=(ev.target&&ev.target.tagName)||"";
      if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
      if(m.paused) return;
      if(m.phase==="question"){
        var k=String(ev.key).toLowerCase();
        var i="abcd".indexOf(k); if(i<0) i="1234".indexOf(k);
        if(i>=0){ ev.preventDefault(); answer(i); }
      } else if(ev.key===" "||ev.key==="Enter"){
        if(m.phase==="spin"){ ev.preventDefault(); spin(); }
        else if(m.phase==="feedback"){ ev.preventDefault(); cont(); }
        else if(m.phase==="unlock"){ ev.preventDefault(); collect(); }
        else if(m.phase==="crownIntro"){ ev.preventDefault(); toPick(); }
      }
    }
    window.addEventListener("keydown",onKey);
    return function(){ window.removeEventListener("keydown",onKey); };
  },[m,rot,spinning]);

  function resolveAnswer(p,pick){
    var q=p.q, ok=(pick!==null&&pick===q.a);
    var teams=clone(p.teams), tm=teams[p.turn];
    var gained=0, unlock=null, crownEarned=false, crownLost=false;
    if(ok){
      gained=POINTS[q.dif]||100; tm.score+=gained; tm.correct++;
      if(q.crown){
        if(tm.unlocked.indexOf(q.cat)<0){
          tm.unlocked.push(q.cat); tm.progress[q.cat]=p.settings.needed;
          tm.score+=UNLOCK_BONUS; gained+=UNLOCK_BONUS; unlock=q.cat;
        }
      } else if(p.settings.unlockRule==="both"&&tm.unlocked.indexOf(q.cat)<0){
        tm.progress[q.cat]=(tm.progress[q.cat]||0)+1;
        if(tm.progress[q.cat]>=p.settings.needed){
          tm.unlocked.push(q.cat); tm.score+=UNLOCK_BONUS; gained+=UNLOCK_BONUS; unlock=q.cat;
        }
      }
      if(tm.correct>0&&tm.correct%p.settings.crownEvery===0&&tm.unlocked.length<CATS.length){
        tm.crowns++; tm.score+=CROWN_BONUS; gained+=CROWN_BONUS; crownEarned=true;
      }
    } else {
      tm.wrong++;
      if(q.crown) crownLost=true;
    }
    var log=p.log.slice(0,59);
    log.unshift({team:tm.name,cat:q.cat,ok:ok,timeout:pick===null,crown:!!q.crown,q:q.q});
    return Object.assign({},p,{phase:"feedback",teams:teams,pick:pick,ok:ok,gained:gained,
      pendingUnlock:unlock,crownEarned:crownEarned,crownLost:crownLost,log:log,consult:null});
  }
  function answer(pick){
    if(m.phase!=="question") return;
    var next=resolveAnswer(m,pick);
    sfx(next.ok?"good":"bad");
    setM(next);
  }
  function cont(){
    sfx("click");
    if(m.pendingUnlock){ sfx("unlock"); confetti(2600); setM(Object.assign({},m,{phase:"unlock"})); return; }
    afterUnlock(m);
  }
  function collect(){
    sfx("click");
    var next=Object.assign({},m,{pendingUnlock:null});
    if(m.teams[m.turn].unlocked.length>=CATS.length){
      sfx("win"); confetti(11000);
      setM(Object.assign(next,{phase:"victory",winner:m.turn,endedAt:Date.now()}));
      return;
    }
    afterUnlock(next);
  }
  function afterUnlock(p){
    var tm=p.teams[p.turn];
    if(tm.crowns>0&&tm.unlocked.length<CATS.length){
      sfx("crown");
      setM(Object.assign({},p,{phase:"crownIntro",pendingUnlock:null,crownEarned:false,fromWheel:false}));
      return;
    }
    setM(Object.assign({},p,{pendingUnlock:null,crownEarned:false}));
    later(nextTurn,10);
  }
  /* each lifeline is good once per team for the whole match */
  function useLifeline(id){
    if(m.phase!=="question"||m.paused||m.consult) return;
    var tm=m.teams[m.turn];
    if(!tm.lifelines||!tm.lifelines[id]) return;
    var spec=LIFELINES.filter(function(l){ return l.id===id; })[0];
    if(!spec) return;
    sfx("crown");
    setM(function(p){
      var teams=clone(p.teams);
      teams[p.turn].lifelines[id]=false;
      if(spec.mode==="extend"){
        return Object.assign({},p,{teams:teams,
          timeLeft:p.timeLeft+spec.secs,
          timeMax:(p.timeMax||p.settings.timer)+spec.secs});
      }
      return Object.assign({},p,{teams:teams,consult:{left:spec.secs,total:spec.secs}});
    });
  }
  function toPick(){ sfx("click"); setM(function(p){ return Object.assign({},p,{phase:"crownPick"}); }); }
  function nextTurn(){
    setLanded(false);
    setM(function(p){ return Object.assign({},p,{phase:"spin",turn:(p.turn+1)%p.teams.length,
      q:null,cat:null,pick:null,ok:null,gained:0,pendingUnlock:null,crownEarned:false,
      crownLost:false,fromWheel:false,timeLeft:p.settings.timer,timeMax:p.settings.timer,
      consult:null,recycled:false}); });
  }
  function drawQuestion(p,catId,isCrown){
    var pool=poolFor(bank,p.settings).filter(function(q){ return q.cat===catId; });
    if(!pool.length) return null;
    var used=p.used||{};
    var avail=pool.filter(function(q){ return !used[q.id]; });
    var recycled=false;
    if(!avail.length){ used=Object.assign({},used); pool.forEach(function(q){ delete used[q.id]; }); avail=pool; recycled=true; }
    var q=avail[Math.floor(Math.random()*avail.length)];
    var order=p.settings.shuffleOpts?shuffle([0,1,2,3]):[0,1,2,3];
    var nu=Object.assign({},used); nu[q.id]=1;
    return {used:nu,recycled:recycled,q:{
      id:q.id,cat:q.cat,dif:q.dif,lvl:q.lvl,ref:q.ref||"",topic:q.topic||"",crown:!!isCrown,
      q:q.q,o:order.map(function(k){return q.o[k];}),a:order.indexOf(q.a),e:q.e}};
  }
  function loadQuestion(catId,isCrown){
    setM(function(p){
      var d=drawQuestion(p,catId,isCrown);
      if(!d) return Object.assign({},p,{phase:isCrown?"crownPick":"spin",noPool:true});
      var teams=p.teams;
      if(isCrown){ teams=clone(p.teams); teams[p.turn].crowns=Math.max(0,teams[p.turn].crowns-1); }
      return Object.assign({},p,{phase:"question",teams:teams,q:d.q,used:d.used,
        timeLeft:p.settings.timer,timeMax:p.settings.timer,consult:null,
        pick:null,ok:null,recycled:d.recycled,noPool:false});
    });
  }
  useEffect(function(){ if(m.noPool){ setToast(T.noQuestions); setM(function(p){return Object.assign({},p,{noPool:false});}); } },[m.noPool]);
  useEffect(function(){ if(m.recycled){ setToast(T.recycled); setM(function(p){return Object.assign({},p,{recycled:false});}); } },[m.recycled]);

  function spin(){
    if(spinning||m.phase!=="spin"||m.paused) return;
    audioResume(); setLanded(false);
    var i=Math.floor(Math.random()*WHEEL.length);
    var target=(360-(i*SEG+SEG/2)+360)%360;
    var delta=(((target-(rot%360))%360)+360)%360;
    setRot(rot+360*6+delta); setSpinning(true); sfx("riser");
    later(function(){
      setSpinning(false); setLanded(true); sfx("land");
      var hit=WHEEL[i];
      setM(function(p){ return Object.assign({},p,{phase:"reveal",cat:hit.id}); });
      later(function(){
        if(hit.id==="crown"){
          setM(function(p){
            var tm=p.teams[p.turn];
            if(tm.unlocked.length>=CATS.length) return p;
            var teams=clone(p.teams); teams[p.turn].crowns++; teams[p.turn].score+=CROWN_BONUS;
            return Object.assign({},p,{teams:teams,phase:"crownIntro",fromWheel:true});
          });
          sfx("crown");
        } else {
          loadQuestion(hit.id,false);
        }
      },1500);
    },5250);
  }
  function skip(){ setDrawer(false); nextTurn(); }
  function restart(){
    setDrawer(false); setLanded(false);
    setM(function(p){
      var ts=p.teams.map(function(tm){ var n=clone(tm);
        n.score=0; n.correct=0; n.wrong=0; n.unlocked=[]; n.progress={}; n.crowns=0;
        n.lifelines=freshLifelines(); return n; });
      return Object.assign({},p,{teams:ts,turn:0,used:{},log:[],phase:"spin",q:null,cat:null,
        pick:null,ok:null,gained:0,pendingUnlock:null,crownEarned:false,crownLost:false,
        fromWheel:false,winner:null,timeLeft:p.settings.timer});
    });
  }

  if(m.phase==="victory"){
    var w=m.teams[m.winner];
    var ranked=m.teams.slice().sort(function(a,b){ return (b.unlocked.length-a.unlocked.length)||(b.score-a.score); });
    return html`<div class="wrap victory">
      <div style=${{fontSize:"56px",lineHeight:1}}>🏆</div>
      <div class="eyebrow">${T.winner}</div>
      <h2 class="winner-name">${w.name}</h2>
      <span class="chip gold tnum" style=${{fontSize:"16px"}}>${T.finalScore}: ${w.score} ${T.pts}</span>
      <div class="winner-cast">${CATS.map(function(c){ return html`<${Tile} key=${c.id} cat=${c.id}/>`; })}</div>
      <div class="card results">
        <div class="eyebrow" style=${{marginBottom:"12px"}}>${T.summary}</div>
        <table><thead><tr>
          <th>${T.team}</th><th>${T.characters}</th><th>${T.crowns}</th>
          <th>${T.hits}</th><th>${T.misses}</th><th style=${{textAlign:"right"}}>${T.score}</th>
        </tr></thead><tbody>
        ${ranked.map(function(tm){ return html`<tr key=${tm.id}>
          <td><span style=${{display:"inline-block",width:"9px",height:"9px",borderRadius:"50%",
            background:tm.color,marginRight:"9px"}}></span>${tm.name}</td>
          <td class="tnum">${tm.unlocked.length}/5</td>
          <td class="tnum">${tm.crowns}</td>
          <td class="tnum">${tm.correct}</td><td class="tnum">${tm.wrong}</td>
          <td class="num">${tm.score}</td>
        </tr>`; })}
        </tbody></table>
      </div>
      <div class="row" style=${{justifyContent:"center"}}>
        <button class="btn lg" onClick=${function(){ sfx("click"); restart(); }}>${T.playAgain}</button>
        <button class="btn lg ghost" onClick=${function(){ sfx("click"); props.onNewGame(); }}>${T.newGame}</button>
      </div>
    </div>`;
  }

  var middle;
  if(m.phase==="question"||m.phase==="feedback"){
    var q=m.q, c=catOf(q.cat), done=m.phase==="feedback";
    var tmax=m.timeMax||s.timer;
    var pct=clamp(m.timeLeft/tmax*100,0,100);
    middle=html`<div class="qcard" style=${catVars(q.cat)}>
      <div class="qhead">
        <${Tile} cat=${q.cat}/>
        <span class="cat">${c.name}</span>
        <span class="tag">${c.subject}</span>
        ${q.crown?html`<span class="chip gold">♛ ${T.crownQuestion}</span>`:null}
        <span class="tag">${T[q.dif]} · ${POINTS[q.dif]}</span>
        ${q.topic?html`<span class="tag">${q.topic}</span>`:html`<span class="tag">${levelName(q.lvl)}</span>`}
        ${q.ref?html`<span class="tag">${q.ref}</span>`:null}
      </div>
      <div class="timer-track"><div class=${"timer-fill"+(m.timeLeft<=5?" warn":"")} style=${{width:pct+"%"}}></div></div>
      <h2 class="qtext">${q.q}</h2>
      <div class="opts">
        ${q.o.map(function(txt,i){
          var cls="opt";
          if(done){ cls+= i===q.a?" correct":(i===m.pick?" wrong":" dim"); }
          return html`<button key=${i} class=${cls} disabled=${done||m.paused}
            onClick=${function(){ answer(i); }}>
            <span class="key">${"ABCD".charAt(i)}</span><span>${txt}</span></button>`;
        })}
      </div>
      ${!done?html`<div class="lifelines">
        ${LIFELINES.map(function(l){
          var left=!!(team.lifelines&&team.lifelines[l.id]);
          return html`<button key=${l.id} class="ll" disabled=${!left||!!m.consult}
            title=${llHint(l.id)} onClick=${function(){ useLifeline(l.id); }}>
            <${LLIcon} id=${l.id}/>
            <span class="nm">${llName(l.id)}</span>
            <span class="secs">${left?"+"+l.secs+"s":T.llUsed}</span></button>`;
        })}
        <span class="hint">${T.llOnce}</span>
      </div>`:null}
      ${done?html`<div class=${"verdict "+(m.ok?"ok":"no")}>
          <span class="big">${m.ok?T.correct:(m.pick===null?T.timeup:T.incorrect)}</span>
          ${m.ok?html`<span class="chip tnum">+${m.gained} ${T.pts}</span>`:null}
          ${m.crownEarned?html`<span class="crown-badge">♛ ${T.crownWon}</span>`:null}
          ${m.crownLost?html`<span class="chip">${T.crownLost}</span>`:null}
        </div>
        <div class="explain">
          ${!m.ok?html`<b>${T.answerWas}: ${"ABCD".charAt(q.a)}. ${q.o[q.a]}</b><br/>`:null}
          ${q.e}
          ${m.ok&&!m.pendingUnlock&&!q.crown&&team.unlocked.indexOf(q.cat)>=0
            ?html`<div style=${{marginTop:"7px",fontSize:"13.5px"}}>${T.already}</div>`:null}
        </div>
        <button class="btn block" onClick=${cont}>
          ${m.pendingUnlock?T.collect:(m.crownEarned?T.continueB:T.next)}</button>`:null}
    </div>`;
  } else if(m.phase==="crownPick"){
    var mine=m.teams[m.turn];
    middle=html`<div style=${{display:"flex",flexDirection:"column",alignItems:"center",gap:"16px",width:"100%"}}>
      <div style=${{textAlign:"center"}}>
        <div class="eyebrow">♛ ${T.crownQuestion}</div>
        <h2 style=${{fontSize:"clamp(20px,2.8vw,28px)",marginTop:"5px"}}>${T.crownPick}</h2>
      </div>
      <div class="crown-pick">
        ${CATS.map(function(c){
          var got=mine.unlocked.indexOf(c.id)>=0;
          return html`<button key=${c.id} class="pick-btn" style=${catVars(c.id)} disabled=${got}
            onClick=${function(){ sfx("click"); loadQuestion(c.id,true); }}>
            <${Tile} cat=${c.id} dim=${got} style=${{width:"100%"}}/>
            <span class="nm">${c.short}</span>
            <span class="got">${got?T.collected:c.subject}</span>
          </button>`;
        })}
      </div>
    </div>`;
  } else if(m.phase==="reveal"){
    var rc=catOf(m.cat);
    middle=html`<${React.Fragment}>
      <${Wheel} rot=${rot} spinning=${false} landed=${landed} disabled=${true} onSpin=${function(){}}/>
      <div class="cat-reveal" style=${catVars(m.cat)}>
        <${Tile} cat=${m.cat}/><span class="nm">${rc.short}</span></div>
    <//>`;
  } else {
    middle=html`<${Wheel} rot=${rot} spinning=${spinning} landed=${landed} disabled=${m.paused} onSpin=${spin}/>`;
  }

  return html`<div class="wrap">
    <div class="topbar">
      <span class="brand">Social Studies <span>Champions</span></span>
      <span class="spacer"></span>
      ${m.paused?html`<span class="chip">⏸ ${T.paused}</span>`:null}
      <button class="icon-btn" title=${T.music}
        onClick=${function(){ props.setAudio({music:!props.audio.music}); }}>${props.audio.music?"♪":"𝄽"}</button>
      <button class="icon-btn" title=${T.teacher} onClick=${function(){ sfx("click"); setDrawer(true); }}>⚙</button>
    </div>
    <div class="turn-bar" style=${{"--tc":team.color}}>
      <span class="eyebrow">${T.turn}</span>
      <span class="who">${team.name}</span>
      <span class="spacer"></span>
      ${team.crowns>0?html`<span class="crown-badge">♛ ${team.crowns}</span>`:null}
      <span class="chip tnum">${team.score} ${T.pts}</span>
      <span class="chip tnum">${team.unlocked.length}/5</span>
    </div>
    <div class="arena">
      <div class="center">${middle}</div>
      ${m.teams.map(function(tm,i){
        return html`<div key=${tm.id} class="seat" style=${seatStyle(i,m.teams.length)}>
          <${TeamCard} team=${tm} settings=${s} active=${i===m.turn}/></div>`;
      })}
    </div>

    ${m.consult?html`<div class="overlay">
      <div class="sheet">
        <div class="eyebrow">${T.consultTitle}</div>
        <div style=${{color:"var(--gold)"}}><${LLIcon} id="ask" size=${54}/></div>
        <div class="consult-num tnum">${Math.ceil(m.consult.left)}</div>
        <div class="consult-ring"><i style=${{width:(m.consult.left/m.consult.total*100)+"%"}}></i></div>
        <p class="muted" style=${{fontWeight:700}}>${T.consultSub}</p>
        <button class="btn lg block" onClick=${function(){ sfx("click"); setM(function(p){ return Object.assign({},p,{consult:null}); }); }}>${T.consultDone}</button>
      </div></div>`:null}

    ${m.phase==="unlock"&&m.pendingUnlock?html`<div class="overlay">
      <div class="rays"></div>
      <div class="sheet" style=${catVars(m.pendingUnlock)}>
        <div class="eyebrow">${T.unlocked}</div>
        <${Tile} cat=${m.pendingUnlock} cls="hero"/>
        <h2 style=${{color:"var(--cc)",fontSize:"clamp(21px,3.4vw,30px)"}}>${catOf(m.pendingUnlock).name}</h2>
        <span class="chip gold tnum">${team.name} · +${UNLOCK_BONUS} ${T.pts}</span>
        <button class="btn lg block" onClick=${collect}>${T.collect}</button>
      </div></div>`:null}

    ${m.phase==="crownIntro"?html`<div class="overlay">
      <div class="rays"></div>
      <div class="sheet">
        <div class="eyebrow">${m.fromWheel?T.crownLanded:T.crownWon}</div>
        <${Tile} cat="crown" cls="hero"/>
        <h2 style=${{fontSize:"clamp(21px,3.4vw,30px)"}}>${team.name}</h2>
        <p class="muted" style=${{fontWeight:700}}>${T.crownPick}</p>
        <button class="btn lg block" onClick=${toPick}>${T.continueB}</button>
      </div></div>`:null}

    ${drawer?html`<${Drawer} match=${m} setMatch=${setM} audio=${props.audio} setAudio=${props.setAudio}
      onClose=${function(){setDrawer(false);}} onSkip=${skip} onRestart=${restart} onExit=${props.onExit}/>`:null}
    ${toast?html`<${Toast} msg=${toast} onDone=${function(){setToast(null);}}/>`:null}
  </div>`;
}

/* ============================ setup ============================ */
function Setup(props){
  var bank=props.bank;
  var cs=useState(clone(props.settings)), cfg=cs[0], setCfg=cs[1];
  function patch(k,v){ setCfg(function(p){ var n=Object.assign({},p); n[k]=v; return n; }); }
  function setCount(n){
    setCfg(function(p){
      var ts=p.teams.slice(0,n);
      while(ts.length<n) ts.push({name:"Team "+(ts.length+1),color:TEAM_COLORS[ts.length]});
      return Object.assign({},p,{teams:ts});
    });
  }
  function setTeam(i,k,v){ setCfg(function(p){ var ts=clone(p.teams); ts[i][k]=v; return Object.assign({},p,{teams:ts}); }); }
  var pool=useMemo(function(){ return poolFor(bank,cfg); },[bank,cfg.set,cfg.level,cfg.difficulty]);
  var perCat=CATS.map(function(c){ return {c:c,n:pool.filter(function(q){return q.cat===c.id;}).length}; });
  var thin=perCat.some(function(x){ return x.n<3; });
  return html`<div class="wrap" style=${{paddingBottom:"48px"}}>
    <${TopBar} back=${function(){props.go("home");}} title=${T.setup}
      audio=${props.audio} setAudio=${props.setAudio}/>
    <div class="card" style=${{marginBottom:"18px"}}>
      <div class="field"><span class="label">${T.numTeams}</span>
        <${Seg} value=${cfg.teams.length} onChange=${setCount}
          items=${[2,3,4].map(function(n){return {v:n,l:n+" "+T.howManyTeams};})}/></div>
      <div style=${{display:"grid",gap:"11px",marginTop:"16px"}}>
        ${cfg.teams.map(function(tm,i){ return html`<div key=${i} class="team-row" style=${{"--tc":tm.color}}>
          <div class="field"><span class="label">${T.teamName} ${i+1}</span>
            <input type="text" id=${"team-name-"+i} value=${tm.name} maxLength="22"
              onChange=${function(e){ setTeam(i,"name",e.target.value); }}/></div>
          <div class="field" style=${{flex:"2 1 250px"}}><span class="label">${T.color}</span>
            <div class="swatches">${TEAM_COLORS.map(function(col){
              return html`<button key=${col} class="swatch" style=${{background:col}} aria-label=${col}
                aria-pressed=${String(tm.color===col)} onClick=${function(){ sfx("click"); setTeam(i,"color",col); }}></button>`;
            })}</div></div>
        </div>`; })}
      </div>
    </div>
    <div class="card grid2" style=${{marginBottom:"18px"}}>
      <div class="field"><span class="label">${T.set}</span>
        <${Seg} value=${cfg.set} onChange=${function(v){patch("set",v);}}
          items=${[{v:"wwi",l:SET_BY_ID.wwi.name},{v:"unit",l:SET_BY_ID.unit.name},
                   {v:"general",l:SET_BY_ID.general.name},{v:"all",l:T.setAll}]}/></div>
      <div class="field"><span class="label">${T.level}</span>
        <${Seg} value=${cfg.level} onChange=${function(v){patch("level",v);}}
          items=${LEVELS.map(function(l){return {v:l.id,l:l.name};})}/>
        <span class="hint">${T.levelHint}</span></div>
      <div class="field"><span class="label">${T.unlockRule}</span>
        <${Seg} value=${cfg.unlockRule} onChange=${function(v){patch("unlockRule",v);}}
          items=${[{v:"crown",l:T.ruleCrown},{v:"both",l:T.ruleBoth}]}/>
        <span class="hint">${cfg.unlockRule==="crown"?T.ruleCrownHint:T.ruleBothHint}</span></div>
      <div class="field"><span class="label">${T.crownEvery}</span>
        <${Seg} value=${cfg.crownEvery} onChange=${function(v){patch("crownEvery",v);}}
          items=${[2,3,4].map(function(v){return {v:v,l:String(v)};})}/></div>
      ${cfg.unlockRule==="both"?html`<div class="field"><span class="label">${T.needed}</span>
        <${Seg} value=${cfg.needed} onChange=${function(v){patch("needed",v);}}
          items=${[1,2,3].map(function(v){return {v:v,l:String(v)};})}/></div>`:null}
      <div class="field"><span class="label">${T.difficulty}</span>
        <${Seg} value=${cfg.difficulty} onChange=${function(v){patch("difficulty",v);}}
          items=${[{v:"easy",l:T.easy},{v:"medium",l:T.medium},{v:"hard",l:T.hard},{v:"mixed",l:T.mixed}]}/></div>
      <div class="field"><span class="label">${T.timeLimit}</span>
        <${Seg} value=${cfg.timer} onChange=${function(v){patch("timer",v);}}
          items=${[15,20,30,45,60].map(function(v){return {v:v,l:v+" "+T.sec};})}/></div>
      <div class="field"><span class="label">${T.options}</span>
        <${Seg} value=${cfg.shuffleOpts} onChange=${function(v){patch("shuffleOpts",v);}}
          items=${[{v:true,l:T.shuffleOpts},{v:false,l:T.fixedOpts}]}/></div>
    </div>
    <div class="card flat" style=${{marginBottom:"18px"}}>
      <div class="eyebrow">${pool.length} ${T.available}</div>
      <div class="row" style=${{marginTop:"11px",gap:"7px"}}>
        ${perCat.map(function(x){ return html`<span key=${x.c.id} class="tag cat" style=${catVars(x.c.id)}>
          ${x.c.subject} ${x.n}</span>`; })}
      </div>
      ${thin?html`<p class="hint" style=${{marginTop:"11px"}}>${T.shortBank}</p>`:null}
    </div>
    <button class="btn lg block" disabled=${pool.length===0}
      onClick=${function(){ audioResume(); sfx("click"); props.onStart(cfg); }}>${T.startMatch}</button>
  </div>`;
}

/* ============================ question bank ============================ */
function QForm(props){
  var st=useState(props.value), v=st[0], setV=st[1];
  function p(k,val){ setV(function(o){ var n=clone(o); n[k]=val; return n; }); }
  function po(i,val){ setV(function(o){ var n=clone(o); n.o[i]=val; return n; }); }
  var valid=String(v.q).trim()&&v.o.every(function(x){return String(x).trim();});
  return html`<div class="card" style=${{marginBottom:"16px",borderColor:"var(--gold)"}}>
    <div class="grid2">
      <div class="field"><span class="label">${T.category}</span>
        <${Seg} value=${v.cat} onChange=${function(x){p("cat",x);}} items=${CATS.map(function(c){return {v:c.id,l:c.subject};})}/></div>
      <div class="field"><span class="label">${T.level}</span>
        <${Seg} value=${v.lvl} onChange=${function(x){p("lvl",x);}} items=${LEVELS.map(function(l){return {v:l.id,l:l.name};})}/></div>
      <div class="field"><span class="label">${T.difficulty}</span>
        <${Seg} value=${v.dif} onChange=${function(x){p("dif",x);}} items=${DIFFS.map(function(d){return {v:d,l:T[d]};})}/></div>
      <div class="field"><span class="label">${T.answer}</span>
        <${Seg} value=${v.a} onChange=${function(x){p("a",x);}} items=${[0,1,2,3].map(function(i){return {v:i,l:"ABCD".charAt(i)};})}/></div>
    </div>
    <div class="field" style=${{marginTop:"16px"}}><span class="label">${T.question}</span>
      <input type="text" id="qf-q" value=${v.q} onChange=${function(e){ p("q",e.target.value); }}/></div>
    <div class="field" style=${{marginTop:"16px"}}><span class="label">${T.options}</span>
      ${[0,1,2,3].map(function(i){ return html`<div key=${i} class="row" style=${{gap:"9px",marginBottom:"7px",flexWrap:"nowrap"}}>
        <span style=${{width:"30px",height:"30px",display:"grid",placeItems:"center",borderRadius:"50%",flex:"0 0 auto",
          background:v.a===i?"var(--good)":"rgba(255,255,255,.14)",color:v.a===i?"#06351d":"#fff",
          fontWeight:900,fontSize:"13px"}}>${"ABCD".charAt(i)}</span>
        <input type="text" id=${"qf-o-"+i} value=${v.o[i]} onChange=${function(e){ po(i,e.target.value); }}/></div>`; })}
    </div>
    <div class="field" style=${{marginTop:"16px"}}><span class="label">${T.explanation}</span>
      <input type="text" id="qf-e" value=${v.e} onChange=${function(e){ p("e",e.target.value); }}/></div>
    <div class="row" style=${{marginTop:"18px"}}>
      <button class="btn" disabled=${!valid} onClick=${function(){ sfx("click"); props.onSave(v); }}>${T.save}</button>
      <button class="btn ghost" onClick=${function(){ sfx("click"); props.onCancel(); }}>${T.cancel}</button>
    </div>
  </div>`;
}

function Bank(props){
  var bank=props.bank, setBank=props.setBank;
  var f=useState({cat:"all",lvl:"all",dif:"all",set:"all",q:""}), flt=f[0], setFlt=f[1];
  var e=useState(null), editing=e[0], setEditing=e[1];
  var io=useState(null), ioMode=io[0], setIoMode=io[1];
  var tx=useState(""), text=tx[0], setText=tx[1];
  var ts=useState(null), toast=ts[0], setToast=ts[1];
  var fm=useState("json"), fmt=fm[0], setFmt=fm[1];
  function patch(k,v){ setFlt(function(p){ var n=Object.assign({},p); n[k]=v; return n; }); }
  var list=useMemo(function(){
    var needle=flt.q.trim().toLowerCase();
    return bank.filter(function(q){
      if(flt.cat!=="all"&&q.cat!==flt.cat) return false;
      if(flt.lvl!=="all"&&q.lvl!==flt.lvl) return false;
      if(flt.dif!=="all"&&q.dif!==flt.dif) return false;
      if(flt.set!=="all"&&(q.set||"general")!==flt.set) return false;
      if(needle){
        var hay=(q.q+" "+q.o.join(" ")+" "+(q.ref||"")+" "+(q.topic||"")).toLowerCase();
        if(hay.indexOf(needle)<0) return false;
      }
      return true;
    });
  },[bank,flt]);
  function save(v){
    var n=normalize(v); if(!n){ setToast(T.badData); return; }
    setBank(function(b){
      if(v.id){ return b.map(function(q){ return q.id===v.id?Object.assign(n,{id:v.id,set:q.set,ref:q.ref,topic:q.topic}):q; }); }
      return b.concat([Object.assign(n,{id:uid(),set:"custom"})]);
    });
    setEditing(null); setToast(T.saved);
  }
  function del(id){ setBank(function(b){ return b.filter(function(q){ return q.id!==id; }); }); }
  function blank(){ return {cat:"history",lvl:"8",dif:"easy",q:"",o:["","","",""],a:0,e:""}; }
  function doExport(kind){ setFmt(kind); setIoMode("export"); setText(kind==="json"?JSON.stringify(bank,null,1):toCSV(bank)); }
  function doImport(replace){
    var parsed; try{ parsed=parseImport(text); }catch(err){ parsed=null; }
    if(!parsed||!parsed.length){ setToast(T.badData); return; }
    setBank(function(b){ return replace?parsed:b.concat(parsed); });
    setToast(parsed.length+" "+T.imported); setIoMode(null); setText("");
  }
  function selectArea(){ var a=document.getElementById("io-area"); if(a){ a.focus(); a.select(); } }
  function copyOut(){
    try{ navigator.clipboard.writeText(text).then(function(){ setToast(T.copied); },selectArea); }
    catch(err){ selectArea(); }
  }
  return html`<div class="wrap" style=${{paddingBottom:"48px"}}>
    <${TopBar} back=${function(){props.go("home");}} title=${T.bank}
      audio=${props.audio} setAudio=${props.setAudio}/>
    <div class="card">
      <div class="toolbar">
        <div class="field"><span class="label">${T.search}</span>
          <input type="text" id="bank-search" value=${flt.q} placeholder="…" onChange=${function(ev){patch("q",ev.target.value);}}/></div>
        <div class="field"><span class="label">${T.category}</span>
          <select id="bank-cat" value=${flt.cat} onChange=${function(ev){patch("cat",ev.target.value);}}>
            <option value="all">${T.all}</option>
            ${CATS.map(function(c){ return html`<option key=${c.id} value=${c.id}>${c.subject}</option>`; })}
          </select></div>
        <div class="field"><span class="label">${T.set}</span>
          <select id="bank-set" value=${flt.set} onChange=${function(ev){patch("set",ev.target.value);}}>
            <option value="all">${T.all}</option>
            ${SETS.map(function(s){ return html`<option key=${s.id} value=${s.id}>${s.name}</option>`; })}
          </select></div>
        <div class="field"><span class="label">${T.level}</span>
          <select id="bank-lvl" value=${flt.lvl} onChange=${function(ev){patch("lvl",ev.target.value);}}>
            <option value="all">${T.all}</option>
            ${LEVELS.map(function(l){ return html`<option key=${l.id} value=${l.id}>${l.name}</option>`; })}
          </select></div>
        <div class="field"><span class="label">${T.difficulty}</span>
          <select id="bank-dif" value=${flt.dif} onChange=${function(ev){patch("dif",ev.target.value);}}>
            <option value="all">${T.all}</option>
            ${DIFFS.map(function(d){ return html`<option key=${d} value=${d}>${T[d]}</option>`; })}
          </select></div>
      </div>
      <div class="row" style=${{marginTop:"14px"}}>
        <button class="btn sm" onClick=${function(){ sfx("click"); setEditing(blank()); setIoMode(null); }}>+ ${T.addQ}</button>
        <button class="btn sm ghost" onClick=${function(){ sfx("click"); setIoMode("import"); setText(""); setEditing(null); }}>${T.importT}</button>
        <button class="btn sm ghost" onClick=${function(){ sfx("click"); doExport("json"); setEditing(null); }}>${T.exportT} JSON</button>
        <button class="btn sm ghost" onClick=${function(){ sfx("click"); doExport("csv"); setEditing(null); }}>${T.exportT} CSV</button>
        <button class="btn sm ghost" onClick=${function(){ sfx("click"); setBank(defaultBank()); setToast(T.restoreDefaults); }}>${T.restoreDefaults}</button>
        <span class="spacer"></span><span class="chip tnum">${list.length} / ${bank.length}</span>
      </div>
    </div>

    ${ioMode==="export"?html`<div class="card" style=${{marginTop:"16px"}}>
      <div class="row between"><span class="eyebrow">${T.exportT} · ${fmt.toUpperCase()}</span>
        <button class="icon-btn" onClick=${function(){setIoMode(null);}} aria-label=${T.close}>✕</button></div>
      <p class="hint" style=${{margin:"8px 0 10px"}}>${T.exportHint}</p>
      <textarea id="io-area" readOnly value=${text}></textarea>
      <div class="row" style=${{marginTop:"12px"}}>
        <button class="btn sm" onClick=${copyOut}>${T.copy}</button>
        <button class="btn sm ghost" onClick=${function(){ doExport(fmt==="json"?"csv":"json"); }}>${fmt==="json"?"CSV":"JSON"}</button>
      </div></div>`:null}

    ${ioMode==="import"?html`<div class="card" style=${{marginTop:"16px"}}>
      <div class="row between"><span class="eyebrow">${T.importT}</span>
        <button class="icon-btn" onClick=${function(){setIoMode(null);}} aria-label=${T.close}>✕</button></div>
      <p class="hint" style=${{margin:"8px 0 10px"}}>${T.importHint}</p>
      <textarea id="io-area" value=${text} onChange=${function(ev){ setText(ev.target.value); }}></textarea>
      <div class="row" style=${{marginTop:"12px"}}>
        <button class="btn sm" onClick=${function(){ doImport(false); }}>${T.merge}</button>
        <button class="btn sm ghost" onClick=${function(){ doImport(true); }}>${T.replaceAll}</button>
      </div></div>`:null}

    ${editing?html`<div style=${{marginTop:"16px"}}>
      <${QForm} value=${editing} onSave=${save} onCancel=${function(){setEditing(null);}}/></div>`:null}

    <div class="bank-list">
      ${list.length?list.map(function(q){
        var c=catOf(q.cat);
        return html`<div key=${q.id} class="qrow" style=${catVars(q.cat)}>
          <div class="meta">
            <span class="tag cat">${c.subject}</span>
            <span class="tag">${(SET_BY_ID[q.set||"general"]||SET_BY_ID.general).short}</span>
            ${q.topic?html`<span class="tag">${q.topic}</span>`:null}
            <span class="tag">${levelName(q.lvl)}</span>
            <span class="tag">${T[q.dif]}</span>
            ${q.ref?html`<span class="tag">${q.ref}</span>`:null}
            <span class="spacer"></span>
            <button class="btn sm ghost" onClick=${function(){ sfx("click"); setEditing(clone(q)); setIoMode(null); window.scrollTo({top:0,behavior:"smooth"}); }}>${T.edit}</button>
            <button class="btn sm ghost" onClick=${function(){ sfx("click"); del(q.id); }}>${T.del}</button>
          </div>
          <div class="qq">${q.q}</div>
          <div class="ans">${"ABCD".charAt(q.a)}. ${q.o[q.a]}</div>
          <div class="exp">${q.e}</div>
        </div>`;
      }):html`<div class="empty">${T.noQuestions}</div>`}
    </div>
    ${toast?html`<${Toast} msg=${toast} onDone=${function(){setToast(null);}}/>`:null}
  </div>`;
}

/* ============================ app ============================ */
var DEFAULT_SETTINGS={
  teams:[{name:"Team 1",color:TEAM_COLORS[0]},{name:"Team 2",color:TEAM_COLORS[1]}],
  level:"10", difficulty:"mixed", timer:30, needed:2, crownEvery:3,
  unlockRule:"crown", set:"wwi", shuffleOpts:true
};
function App(){
  var sc=useState("home"), screen=sc[0], setScreen=sc[1];
  var bs=useState(loadBank), bank=bs[0], setBank=bs[1];
  var ss=useState(function(){ return Object.assign({},DEFAULT_SETTINGS,lsGet("ssc.settings",{})); }), settings=ss[0], setSettings=ss[1];
  var ad=useState(function(){ return Object.assign({sfx:true,music:true,vol:0.75},lsGet("ssc.audio",{})); }), audio=ad[0], setAudioState=ad[1];
  var ms=useState(function(){
    var saved=lsGet("ssc.match",null);
    if(saved&&saved.teams&&saved.teams.length&&saved.teams[0].crowns!==undefined){
      if(saved.phase==="spinning"||saved.phase==="reveal") saved.phase="spin";
      /* matches saved before lifelines existed still open cleanly */
      saved.teams.forEach(function(t){ if(!t.lifelines) t.lifelines=freshLifelines(); });
      if(saved.timeMax===undefined) saved.timeMax=(saved.settings||{}).timer||30;
      saved.consult=null;
      return saved;
    }
    return null;
  }), match=ms[0], setMatch=ms[1];

  function setAudio(patch){
    setAudioState(function(p){ var n=Object.assign({},p,patch); applyAudio(n); audioResume(); return n; });
  }
  useEffect(function(){ lsSet("ssc.bank",bank); },[bank]);
  useEffect(function(){ lsSet("ssc.settings",settings); },[settings]);
  useEffect(function(){ lsSet("ssc.audio",audio); applyAudio(audio); },[audio]);
  useEffect(function(){ if(match) lsSet("ssc.match",match); else lsDel("ssc.match"); },[match]);
  useEffect(function(){ document.documentElement.lang="en"; },[]);
  useEffect(function(){
    function once(){ audioResume(); }
    window.addEventListener("pointerdown",once,{once:true});
    window.addEventListener("keydown",once,{once:true});
    return function(){ window.removeEventListener("pointerdown",once); window.removeEventListener("keydown",once); };
  },[]);
  useEffect(function(){ if(screen!=="game") musicStart("menu"); },[screen]);

  function start(cfg){
    setSettings(cfg);
    var teams=cfg.teams.map(function(tm,i){
      return {id:"t"+i+"_"+Date.now().toString(36),name:(tm.name||("Team "+(i+1))).trim(),
        color:tm.color,score:0,correct:0,wrong:0,unlocked:[],progress:{},crowns:0,
        lifelines:freshLifelines()};
    });
    setMatch({settings:clone(cfg),teams:teams,turn:0,used:{},log:[],phase:"spin",q:null,cat:null,
      pick:null,ok:null,gained:0,pendingUnlock:null,crownEarned:false,crownLost:false,
      fromWheel:false,winner:null,paused:false,timeLeft:cfg.timer,startedAt:Date.now()});
    setScreen("game");
  }
  function newGame(){ setMatch(null); setScreen("setup"); }
  function exitHome(){ setScreen("home"); }

  var common={audio:audio,setAudio:setAudio,go:setScreen};
  var view;
  if(screen==="game"&&match){
    view=html`<${Game} match=${match} setMatch=${setMatch} bank=${bank}
      audio=${audio} setAudio=${setAudio} onExit=${exitHome} onNewGame=${newGame}/>`;
  } else if(screen==="setup"){
    view=html`<${Setup} ...${common} settings=${settings} bank=${bank} onStart=${start}/>`;
  } else if(screen==="howto"){
    view=html`<${HowTo} ...${common}/>`;
  } else if(screen==="bank"){
    view=html`<${Bank} ...${common} bank=${bank} setBank=${setBank}/>`;
  } else {
    view=html`<${Home} ...${common} hasMatch=${!!(match&&match.phase!=="victory")}/>`;
  }
  return html`<${React.Fragment}><${Stars}/><div class="app">${view}</div><//>`;
}

var root=ReactDOM.createRoot(document.getElementById("root"));
function boot(){ root.render(html`<${App}/>`); }
if(window.claude&&window.claude.hot&&window.claude.hot.ready){ window.claude.hot.ready(boot); } else { boot(); }
})();
</script>
</body>
</html>
