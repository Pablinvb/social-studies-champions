<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Social Studies Champions: a team trivia game. Spin the wheel, answer, and collect all five characters to win.">
<meta name="theme-color" content="#150a2b">
<meta property="og:title" content="Social Studies Champions">
<meta property="og:description" content="Collect the characters. Conquer the knowledge. A classroom trivia game for Social Studies.">
<meta property="og:type" content="website">
<meta property="og:image" content="social-card.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png" type="image/png">
<style>
  :root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Social Studies Champions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap">
<style>
/* Layout concept: a purple arcade stage — one fixed starfield behind a centre column that
   switches between hero, board and question; teams always visible as a rail to the right. */
:root{
  --void:#150a2b; --deep:#22103f; --panel:#2f1659; --panel-2:#3b1d6e; --panel-3:#4a2585;
  --edge:#6a34c4; --violet:#8f44dd; --violet-soft:#a96bea;
  --gold:#ffc83d; --gold-deep:#ef8a1c; --gold-pale:#ffe9a8;
  --ink:#f7eeff; --muted:#c0a6e8; --faint:#9b7fcb;
  --good:#2ed873; --good-deep:#17a854; --bad:#ff4f72; --bad-deep:#c6163c;
  --c-history:#e3a44b; --c-geography:#3fc37a; --c-civics:#5d8df3; --c-economics:#ffc83d; --c-culture:#f05fc8;
  --r-s:10px; --r-m:18px; --r-l:28px;
  --f-display:"Bungee","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0;min-height:100%;font-family:var(--f-body);color:var(--ink);
  background:
    radial-gradient(1100px 700px at 50% -10%, #5b2ba8 0%, rgba(91,43,168,0) 62%),
    radial-gradient(800px 560px at 12% 100%, #7a2fae 0%, rgba(122,47,174,0) 60%),
    radial-gradient(700px 500px at 92% 86%, #4a1f8c 0%, rgba(74,31,140,0) 60%),
    var(--void);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1320px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));}
h1,h2,h3{text-wrap:balance;margin:0}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--f-display);font-size:clamp(15px,1.5vw,20px);letter-spacing:.5px;
  color:#3a1a00;background:linear-gradient(180deg,var(--gold-pale) 0%,var(--gold) 38%,var(--gold-deep) 100%);
  border:0;border-radius:var(--r-m);padding:16px 30px;cursor:pointer;
  box-shadow:0 7px 0 #a85b08,0 14px 26px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.65);
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;text-decoration:none;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #a85b08,0 6px 14px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.5)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{
  color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.22);
}
.btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.22)}
.btn.sm{font-size:13px;padding:10px 16px;border-radius:var(--r-s);box-shadow:0 4px 0 #a85b08,0 8px 16px rgba(0,0,0,.35)}
.btn.sm:active{box-shadow:0 1px 0 #a85b08}
.btn.sm.ghost{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.2)}
.btn.block{width:100%}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--ink);
  font-size:19px;cursor:pointer;transition:background .15s,transform .15s;
}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn:active{transform:scale(.93)}
.icon-btn.on{background:var(--gold);color:#3a1a00;border-color:var(--gold-pale)}

/* ---------- panels ---------- */
.panel{
  background:linear-gradient(180deg,rgba(74,37,133,.92),rgba(42,20,80,.94));
  border:2px solid rgba(169,107,234,.42);border-radius:var(--r-l);
  box-shadow:0 18px 44px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14);
  padding:22px;
}
.panel.tight{padding:16px;border-radius:var(--r-m)}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:2.4px;color:var(--gold);text-transform:uppercase}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.topbar .brand{font-family:var(--f-display);font-size:clamp(14px,1.6vw,19px);color:var(--gold);letter-spacing:1px}
.topbar .spacer{flex:1 1 auto;min-width:0}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:28px 46px;text-align:center}
.logo{font-family:var(--f-display);line-height:.96;letter-spacing:1px;margin:0}
.logo .l1{display:block;font-size:clamp(30px,7.2vw,76px);
  background:linear-gradient(180deg,#fff7e0 0%,var(--gold) 46%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #8f3d00) drop-shadow(0 12px 26px rgba(255,170,40,.42));}
.logo .l2{display:block;font-size:clamp(20px,4.6vw,46px);color:var(--ink);
  filter:drop-shadow(0 3px 0 #4a1f8c) drop-shadow(0 10px 22px rgba(0,0,0,.5));}
.tagline{font-style:italic;color:var(--gold-pale);font-size:clamp(14px,1.8vw,20px);font-weight:700;letter-spacing:.4px}
.char-row{display:flex;justify-content:center;align-items:flex-end;gap:clamp(2px,1.4vw,22px);flex-wrap:wrap;width:100%}
.char-pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(92px,17vw,186px);animation:float 5s ease-in-out infinite}
.char-pod:nth-child(2){animation-delay:.5s}.char-pod:nth-child(3){animation-delay:1s}
.char-pod:nth-child(4){animation-delay:1.5s}.char-pod:nth-child(5){animation-delay:2s}
.char-pod img{width:100%;display:block;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.char-pod .nm{font-family:var(--f-display);font-size:clamp(10px,1.2vw,15px);letter-spacing:1.2px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.home-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.home-note{color:var(--muted);font-size:14px;max-width:62ch}

/* ---------- forms ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.label{font-family:var(--f-display);font-size:11px;letter-spacing:1.8px;color:var(--gold);text-transform:uppercase}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{
  font-family:var(--f-body);font-weight:900;font-size:14px;color:var(--ink);cursor:pointer;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16);border-radius:var(--r-s);
  padding:10px 14px;transition:all .14s ease;
}
.seg button:hover{background:rgba(255,255,255,.15)}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold-pale);color:#3a1a00;box-shadow:0 0 0 3px rgba(255,200,61,.25)}
input[type=text],textarea,select{
  font-family:var(--f-body);font-size:15px;font-weight:700;color:var(--ink);
  background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.18);border-radius:var(--r-s);padding:11px 13px;width:100%;
}
textarea{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px;font-weight:400;line-height:1.5;min-height:180px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:transparent}
select option{background:#2f1659;color:var(--ink)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.3);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35);transform:scale(1.12)}
.team-setup{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:14px;border-radius:var(--r-m);
  background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.1)}
.team-setup .field{flex:1 1 180px}

/* ---------- game layout ---------- */
.board{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start;padding-bottom:30px}
@media (max-width:900px){.board{grid-template-columns:1fr}}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}

/* turn banner */
.turn-banner{
  width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-radius:var(--r-m);padding:12px 18px;border:2px solid rgba(255,255,255,.22);
  background:linear-gradient(90deg,var(--tc,#8f44dd) 0%,rgba(0,0,0,.25) 100%);
  box-shadow:0 10px 26px rgba(0,0,0,.35);
}
.turn-banner .who{font-family:var(--f-display);font-size:clamp(15px,2.2vw,24px);letter-spacing:.6px}
.turn-banner .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:900;opacity:.85}
.turn-banner .spacer{flex:1 1 auto}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 13px;font-weight:900;font-size:13px;
  background:rgba(0,0,0,.34);border:2px solid rgba(255,255,255,.2)}

/* wheel */
.wheel-stage{position:relative;width:min(100%,460px);aspect-ratio:1/1;display:grid;place-items:center}
.wheel-rotor{width:100%;height:100%;transform:rotate(0deg)}
.wheel-rotor.spin{transition:transform 4.6s cubic-bezier(.17,.72,.14,1)}
.wheel-glow{position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(255,200,61,.3),transparent 62%);filter:blur(12px);pointer-events:none}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;z-index:3;
  border-left:19px solid transparent;border-right:19px solid transparent;border-top:38px solid var(--gold);
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.6))}
.spin-hub{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;z-index:2;border:0;cursor:pointer;
  font-family:var(--f-display);font-size:clamp(13px,2.2vw,21px);color:#3a1a00;letter-spacing:.5px;
  background:radial-gradient(circle at 36% 30%,#fff6dc,var(--gold) 48%,var(--gold-deep));
  box-shadow:0 6px 0 #a85b08,0 14px 30px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.7);
  transition:transform .12s}
.spin-hub:active{transform:scale(.95)}
.spin-hub[disabled]{opacity:.55;cursor:default}
.spin-hub:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cat-reveal{display:flex;align-items:center;gap:14px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.cat-reveal img{width:84px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.cat-reveal .nm{font-family:var(--f-display);font-size:clamp(18px,3vw,30px)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* question */
.qcard{width:100%;max-width:860px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qhead img{width:52px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.qhead .cat{font-family:var(--f-display);font-size:15px;letter-spacing:1px}
.badge{font-size:11px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;padding:5px 11px;border-radius:999px;
  background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2)}
.timer-wrap{width:100%;height:16px;border-radius:999px;background:rgba(0,0,0,.45);overflow:hidden;border:2px solid rgba(255,255,255,.16)}
.timer-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--good),var(--gold));transition:width .25s linear}
.timer-bar.warn{background:linear-gradient(90deg,var(--gold),var(--bad));animation:pulse .6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.qtext{font-size:clamp(18px,2.7vw,30px);font-weight:900;line-height:1.3;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;cursor:pointer;width:100%;
  font-family:var(--f-body);font-size:clamp(15px,1.7vw,18px);font-weight:700;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:2px solid rgba(255,255,255,.2);border-radius:var(--r-m);padding:15px 17px;
  transition:transform .12s,background .15s,border-color .15s}
.opt:hover:not([disabled]){background:rgba(255,255,255,.2);transform:translateY(-2px)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .key{flex:0 0 auto;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--f-display);font-size:17px;color:#3a1a00;background:var(--gold-pale)}
.opt.correct{background:linear-gradient(180deg,rgba(46,216,115,.4),rgba(23,168,84,.25));border-color:var(--good);animation:goodshake .5s}
.opt.correct .key{background:var(--good);color:#04260f}
.opt.wrong{background:linear-gradient(180deg,rgba(255,79,114,.38),rgba(198,22,60,.22));border-color:var(--bad);animation:badshake .45s}
.opt.wrong .key{background:var(--bad);color:#2b0010}
.opt.dim{opacity:.4}
.opt[disabled]{cursor:default}
@keyframes goodshake{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes badshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.verdict{display:flex;align-items:center;gap:12px;border-radius:var(--r-m);padding:14px 18px;font-weight:900;
  border:2px solid rgba(255,255,255,.2);animation:pop .3s ease}
.verdict.ok{background:linear-gradient(90deg,rgba(46,216,115,.4),rgba(46,216,115,.1));border-color:var(--good)}
.verdict.no{background:linear-gradient(90deg,rgba(255,79,114,.38),rgba(255,79,114,.1));border-color:var(--bad)}
.verdict .big{font-family:var(--f-display);font-size:clamp(15px,2vw,22px)}
.explain{font-size:15px;font-weight:600;line-height:1.5;color:var(--ink)}

/* teams rail */
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:900px){.rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.team-card{border-radius:var(--r-m);padding:13px;border:3px solid var(--tc);
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(0,0,0,.3));box-shadow:0 10px 24px rgba(0,0,0,.33);
  transition:transform .2s,box-shadow .2s}
.team-card.active{transform:scale(1.025);box-shadow:0 0 0 4px rgba(255,255,255,.25),0 14px 30px rgba(0,0,0,.45)}
.team-card .thead{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.team-card .dot{width:15px;height:15px;border-radius:50%;background:var(--tc);border:2px solid rgba(255,255,255,.6);flex:0 0 auto}
.team-card .tname{font-family:var(--f-display);font-size:14px;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.team-card .score{font-family:var(--f-display);font-size:17px;color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{position:relative;aspect-ratio:1/1;border-radius:12px;display:grid;place-items:center;overflow:hidden;
  background:rgba(0,0,0,.4);border:2px dashed rgba(255,255,255,.22)}
.slot img{width:100%;height:100%;object-fit:contain}
.slot.got{border-style:solid;border-color:var(--cc);background:radial-gradient(circle,rgba(255,255,255,.2),rgba(0,0,0,.35));
  box-shadow:0 0 12px var(--cc);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.slot .prog{position:absolute;inset:auto 0 0 0;height:4px;background:var(--cc);transition:width .4s}
.slot .ghost{opacity:.26;filter:grayscale(1)}
.mini-prog{margin-top:7px;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.3px}

/* unlock + victory */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,4,24,.82);
  padding:max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(3px);animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.unlock-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:460px;
  animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.unlock-card img{width:min(58vw,260px);animation:unlockspin 1s cubic-bezier(.2,1.3,.3,1)}
@keyframes unlockspin{0%{transform:scale(.2) rotate(-200deg);opacity:0}70%{transform:scale(1.14) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.rays{position:absolute;width:min(90vw,620px);aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(255,200,61,.34) 0 8deg,transparent 8deg 24deg);
  animation:spin360 9s linear infinite;mask-image:radial-gradient(circle,#000 18%,transparent 68%);
  -webkit-mask-image:radial-gradient(circle,#000 18%,transparent 68%)}
@keyframes spin360{to{transform:rotate(360deg)}}
.trophy{font-size:clamp(56px,12vw,120px);line-height:1;filter:drop-shadow(0 10px 20px rgba(255,180,40,.6));animation:float 3.4s ease-in-out infinite}
.victory{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:30px}
.winner-name{font-family:var(--f-display);font-size:clamp(26px,6vw,62px);letter-spacing:1px;
  background:linear-gradient(180deg,#fff7e0,var(--gold) 50%,var(--gold-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #8f3d00)}
.winner-chars{display:flex;gap:clamp(4px,1.6vw,18px);justify-content:center;flex-wrap:wrap}
.winner-chars img{width:clamp(66px,12vw,132px);animation:float 4s ease-in-out infinite;filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.winner-chars img:nth-child(2){animation-delay:.4s}.winner-chars img:nth-child(3){animation-delay:.8s}
.winner-chars img:nth-child(4){animation-delay:1.2s}.winner-chars img:nth-child(5){animation-delay:1.6s}
#confetti{position:fixed;inset:0;z-index:50;pointer-events:none}

/* results table */
.results{width:100%;max-width:760px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.14);font-size:14px}
th{font-family:var(--f-display);font-size:11px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:900}

/* teacher drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:45;overflow-y:auto;
  background:linear-gradient(180deg,#38196b,#1d0d38);border-left:3px solid var(--gold);
  box-shadow:-18px 0 50px rgba(0,0,0,.6);animation:slidein .25s ease;
  padding:18px max(18px,env(safe-area-inset-right,0px)) 40px 18px}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer h3{font-family:var(--f-display);font-size:16px;color:var(--gold);letter-spacing:1px;margin:22px 0 10px}
.drawer h3:first-of-type{margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.log-item{font-size:12.5px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.3);margin-bottom:6px;border-left:4px solid var(--lc,#888)}
.log-item b{font-weight:900}

/* bank */
.bank-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.qrow{border-radius:var(--r-m);padding:13px;background:rgba(0,0,0,.26);border:2px solid rgba(255,255,255,.12);border-left:6px solid var(--cc)}
.qrow .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.qrow .qq{font-weight:900;font-size:15px;line-height:1.35}
.qrow .ans{margin-top:8px;font-size:13.5px;font-weight:700;color:var(--good)}
.qrow .exp{margin-top:5px;font-size:13px;color:var(--muted);line-height:1.5}
.tag{font-size:10.5px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;padding:4px 9px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.tag.cat{background:var(--cc);color:#1b0a2e;border-color:transparent}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .field{flex:1 1 150px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;
  background:var(--gold);color:#3a1a00;font-weight:900;padding:12px 22px;border-radius:999px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .3s}
.steps{display:grid;gap:14px;counter-reset:s}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-display);font-size:17px;color:#3a1a00;background:var(--gold)}
.step p{margin:4px 0 0;color:var(--muted);line-height:1.55;font-weight:600}
.step h4{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.5px}
.kbd{display:inline-block;font-family:ui-monospace,monospace;font-size:12px;background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:2px 7px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .wheel-rotor.spin{transition:transform .4s ease-out}
}

function lsGet(k,d){ try{var v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} }
function lsSet(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function lsDel(k){ try{localStorage.removeItem(k);}catch(e){} }
function uid(p){ return (p||"c")+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function shuffle(a){ var r=a.slice(); for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;} return r; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }

/* ---- sound ---- */
var actx=null, soundOn=true;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=false; } } return actx||null; }
function tone(f1,f2,dur,type,vol,at){
  if(!soundOn) return;
  var c=ac(); if(!c) return;
  try{
    var t0=c.currentTime+(at||0);
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(f1,t0);
    if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.14,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
var SFX={
  click:function(){ tone(520,660,0.07,"square",0.07); },
  spin:function(){ for(var i=0;i<16;i++) tone(300+i*18,320+i*18,0.07,"sawtooth",0.045,i*0.26); },
  land:function(){ tone(880,1320,0.18,"triangle",0.16); },
  good:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,f,0.16,"triangle",0.13,i*0.085); }); },
  bad:function(){ tone(220,110,0.42,"sawtooth",0.12); },
  tick:function(){ tone(1200,1200,0.04,"square",0.05); },
  unlock:function(){ [523,659,784,1047,1319,1568].forEach(function(f,i){ tone(f,f,0.24,"triangle",0.14,i*0.1); }); },
  win:function(){ [392,523,659,784,1047,784,1047,1319].forEach(function(f,i){ tone(f,f,0.3,"triangle",0.15,i*0.16); }); }
};

/* ---- confetti ---- */
var confettiStop=0, confettiRunning=false;
function confetti(ms){
  var cv=document.getElementById("confetti"); if(!cv) return;
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.hidden=false;
  var ctx=cv.getContext("2d"), parts=[];
  function size(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
  size();
  var cols=["#ffc83d","#ff4f72","#3fc37a","#5d8df3","#f05fc8","#ffffff","#ef8a1c"];
  for(var i=0;i<160;i++) parts.push({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*0.6,
    w:5+Math.random()*8, h:7+Math.random()*10,
    vy:2.2+Math.random()*3.6, vx:-1.6+Math.random()*3.2,
    r:Math.random()*Math.PI, vr:-0.16+Math.random()*0.32,
    c:cols[(Math.random()*cols.length)|0]
  });
  confettiStop=Date.now()+(ms||4200);
  if(confettiRunning) return;
  confettiRunning=true;
  (function frame(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<parts.length;i++){
      var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      if(p.y>cv.height+30){ p.y=-20; p.x=Math.random()*cv.width; }
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if(Date.now()<confettiStop){ requestAnimationFrame(frame); }
    else { ctx.clearRect(0,0,cv.width,cv.height); cv.hidden=true; confettiRunning=false; }
  })();
  window.addEventListener("resize",size);
}

/* ---- starfield ---- */
function Stars(){
  var ref=useRef(null);
  useEffect(function(){
    var cv=ref.current; if(!cv) return;
    var ctx=cv.getContext("2d"), stars=[], raf=0,
        reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function build(){
      cv.width=window.innerWidth; cv.height=window.innerHeight; stars=[];
      var n=Math.min(190,Math.round(cv.width*cv.height/11000));
      for(var i=0;i<n;i++) stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
        r:Math.random()*1.7+0.3,p:Math.random()*Math.PI*2,s:0.012+Math.random()*0.03});
    }
    build();
    function frame(){
      ctx.clearRect(0,0,cv.width,cv.height);
      for(var i=0;i<stars.length;i++){
        var s=stars[i]; s.p+=s.s;
        ctx.globalAlpha=0.3+Math.abs(Math.sin(s.p))*0.7;
        ctx.fillStyle=i%9===0?"#ffd97a":"#ffffff";
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
      }
      ctx.globalAlpha=1;
      if(!reduce) raf=requestAnimationFrame(frame);
    }
    frame();
    window.addEventListener("resize",build);
    return function(){ cancelAnimationFrame(raf); window.removeEventListener("resize",build); };
  },[]);
  return html`<canvas id="stars" ref=${ref} aria-hidden="true"></canvas>`;
}

/* ============================ bank helpers ============================ */
function defaultBank(){ return clone(SEED); }
function loadBank(){
  var b=lsGet("ssc.bank",null);
  if(!b||!b.length) return defaultBank();
  /* older saves held a bilingual shape; fall back to the shipped bank rather than an empty one */
  var ok=b.filter(function(q){ return q&&typeof q.q==="string"&&q.o&&q.o.length===4&&CAT_BY_ID[q.cat]; });
  return ok.length?ok:defaultBank();
}
/* The school level narrows the general bank only: a chosen unit always plays in full. */
function poolFor(bank,s){
  var max=LEVEL_ORDER[s.level]; if(max===undefined) max=5;
  return bank.filter(function(q){
    var set=q.set||"general";
    if(s.set!=="all"&&set!==s.set) return false;
    if(set==="general"&&(LEVEL_ORDER[q.lvl]===undefined||LEVEL_ORDER[q.lvl]>max)) return false;
    if(s.difficulty!=="mixed"&&q.dif!==s.difficulty) return false;
    return true;
  });
}
var CSV_HEAD=["id","set","ref","topic","category","level","difficulty","question","a","b","c","d","answer","explanation"];
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function toCSV(bank){
  var rows=[CSV_HEAD.join(",")];
  bank.forEach(function(q){
    rows.push([q.id,q.set||"general",q.ref||"",q.topic||"",q.cat,q.lvl,q.dif,q.q,
      q.o[0],q.o[1],q.o[2],q.o[3],"ABCD".charAt(q.a),q.e].map(csvCell).join(","));
  });
  return rows.join("\n");
}
function parseCSV(text){
  var rows=[],row=[],cur="",q=false,i=0;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(;i<text.length;i++){
    var ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    } else if(ch==='"'){ q=true; }
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.length>1||r[0]!==""; });
}
function normalize(o){
  if(!o) return null;
  var cat=String(o.cat||o.category||"").toLowerCase().trim();
  if(!CAT_BY_ID[cat]) return null;
  var opts=o.o&&o.o.length?o.o:[o.a,o.b,o.c,o.d];
  opts=(opts||[]).map(function(x){ return String(x==null?"":x).trim(); });
  if(opts.length!==4||!opts.every(function(x){return x;})) return null;
  var a=o.answer;
  if(a===undefined||a===null||a===""){ a=o.a; }
  if(typeof a==="string"){
    var l=a.trim().toUpperCase().charAt(0);
    a="ABCD".indexOf(l)>=0?"ABCD".indexOf(l):parseInt(a,10);
  }
  a=parseInt(a,10); if(isNaN(a)||a<0||a>3) return null;
  var text=String(o.q||o.question||"").trim(); if(!text) return null;
  var lvl=String(o.lvl||o.level||"8").trim().toUpperCase().replace("º","");
  if(LEVEL_ORDER[lvl]===undefined) lvl="8";
  var dif=String(o.dif||o.difficulty||"medium").toLowerCase().trim();
  if(DIFFS.indexOf(dif)<0) dif="medium";
  var set=String(o.set||"custom").toLowerCase().trim();
  if(!SET_BY_ID[set]) set="custom";
  return {id:o.id||uid(),set:set,ref:o.ref||"",topic:o.topic||"",cat:cat,lvl:lvl,dif:dif,
    q:text,o:opts,a:a,e:String(o.e||o.explanation||"").trim()};
}
function parseImport(text){
  text=(text||"").trim(); if(!text) return [];
  var out=[];
  if(text.charAt(0)==="["||text.charAt(0)==="{"){
    var data=JSON.parse(text);
    if(!Array.isArray(data)) data=data.questions||data.bank||[data];
    data.forEach(function(o){ var n=normalize(o); if(n) out.push(n); });
  } else {
    var rows=parseCSV(text); if(rows.length<2) return [];
    var head=rows[0].map(function(h){ return String(h).trim().toLowerCase(); });
    for(var i=1;i<rows.length;i++){
      var obj={}; head.forEach(function(h,j){ obj[h]=rows[i][j]; });
      var n=normalize(obj); if(n) out.push(n);
    }
  }
  return out;
}

/* ============================ wheel ============================ */
function Wheel(props){
  var r=96, cx=100, cy=100;
  function pt(deg,rad){ var a=(deg-90)*Math.PI/180; return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)]; }
  var sectors=CATS.map(function(c,i){
    var a1=i*72, a2=a1+72;
    var p1=pt(a1,r), p2=pt(a2,r), mid=pt(a1+36,62);
    return html`<g key=${c.id}>
      <path d=${"M"+cx+","+cy+" L"+p1[0].toFixed(2)+","+p1[1].toFixed(2)+" A"+r+","+r+" 0 0 1 "+p2[0].toFixed(2)+","+p2[1].toFixed(2)+" Z"}
        fill=${c.color} stroke="#2a1252" stroke-width="2"/>
      <image href=${c.img} x=${(mid[0]-23).toFixed(2)} y=${(mid[1]-23).toFixed(2)} width="46" height="46"/>
    </g>`;
  });
  return html`<div class="wheel-stage">
    <div class="wheel-glow"></div>
    <div class="pointer"></div>
    <div class=${"wheel-rotor"+(props.spinning?" spin":"")} style=${{transform:"rotate("+props.rot+"deg)"}}>
      <svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
        <circle cx="100" cy="100" r="99" fill="#2a1252"/>
        ${sectors}
        <circle cx="100" cy="100" r="96" fill="none" stroke="#ffc83d" stroke-width="5"/>
        <circle cx="100" cy="100" r="99" fill="none" stroke="#7a3fc9" stroke-width="3"/>
      </svg>
    </div>
    <button class="spin-hub" onClick=${props.onSpin} disabled=${props.spinning||props.disabled}
      aria-label=${T.spin}>${props.spinning?T.spinning:T.spin}</button>
  </div>`;
}

  }

    ${m.teams.map(function(tm,i){ return html`<div key=${tm.id} class="row between" style=${{marginBottom:"8px"}}>

      <span class="row">

        <button class="btn sm ghost" onClick=${function(){bump(i,100);}}>+100</button>
      </span></div>`; })}

    <h3>${T.chars}</h3>
    ${m.teams.map(function(tm,i){ return html`<div key=${tm.id} style=${{marginBottom:"10px"}}>
      <b style=${{fontSize:"13px"}}>${tm.name}</b>
      <div class="row" style=${{marginTop:"6px"}}>
        ${CATS.map(function(c){ var got=tm.unlocked.indexOf(c.id)>=0;
          return html`<button key=${c.id} class=${"icon-btn"+(got?" on":"")} title=${c.name+" — "+(got?T.revoke:T.grant)}
            onClick=${function(){ SFX.click(); toggleChar(i,c.id); }}
            style=${{padding:"2px",overflow:"hidden",borderColor:got?c.color:"rgba(255,255,255,.25)"}}>
            <${CharImg} cat=${c.id} style=${{width:"100%",opacity:got?1:.4}}/>
          </button>`; })}
      </div></div>`; })}

    <h3>${T.setup}</h3>
    <div class="field"><span class="label">${T.timeLimit}</span>
      <${Seg} value=${s.timer} onChange=${function(v){patchSettings("timer",v);}}
        items=${[15,20,30,45,60].map(function(v){return {v:v,l:v+T.sec};})}/></div>
    <div class="field" style=${{marginTop:"10px"}}><span class="label">${T.needed}</span>
      <${Seg} value=${s.needed} onChange=${function(v){patchSettings("needed",v);}}
        items=${[1,2,3].map(function(v){return {v:v,l:String(v)};})}/></div>
    <div class="field" style=${{marginTop:"10px"}}><span class="label">${T.difficulty}</span>
      <${Seg} value=${s.difficulty} onChange=${function(v){patchSettings("difficulty",v);}}
        items=${[{v:"easy",l:T.easy},{v:"medium",l:T.medium},{v:"hard",l:T.hard},{v:"mixed",l:T.mixed}]}/></div>
    <div class="field" style=${{marginTop:"10px"}}><span class="label">${T.level}</span>
      <${Seg} value=${s.level} onChange=${function(v){patchSettings("level",v);}}
        items=${LEVELS.map(function(l){return {v:l.id,l:l.name};})}/></div>

    <h3>${T.review}</h3>
    ${m.log.length?m.log.slice(0,14).map(function(L,i){
      return html`<div key=${i} class="log-item" style=${{"--lc":L.ok?"var(--good)":"var(--bad)"}}>
        <b>${L.team}</b> · ${catOf(L.cat).name} · ${L.ok?"✔":(L.timeout?"⏱":"✘")}<br/>
        <span class="muted">${L.q}</span></div>`;
    }):html`<p class="muted" style=${{fontSize:"13px"}}>${T.noLog}</p>`}

    <h3>${T.restart}</h3>
    <div class="row">
      <button class="btn sm ghost" onClick=${function(){ SFX.click(); props.onRestart(); }}>${T.restart}</button>
      <button class="btn sm ghost" onClick=${function(){ SFX.click(); props.onExit(); }}>${T.exit}</button>
    </div>
  </aside>`;
}

/* ============================ game ============================ */
function Game(props){
  var m=props.match, setM=props.setMatch, bank=props.bank;
  var s=m.settings, team=m.teams[m.turn];
  var st=useState(0), rot=st[0], setRot=st[1];
  var sp=useState(false), spinning=sp[0], setSpinning=sp[1];
  var dr=useState(false), drawer=dr[0], setDrawer=dr[1];
  var to=useState(null), toast=to[0], setToast=to[1];
  var timers=useRef([]);
  useEffect(function(){ return function(){ timers.current.forEach(clearTimeout); }; },[]);
  function later(fn,ms){ var id=setTimeout(fn,ms); timers.current.push(id); return id; }

  /* timer */
  useEffect(function(){
    if(m.phase!=="question"||m.paused) return;
    var iv=setInterval(function(){
      setM(function(p){
        if(p.phase!=="question"||p.paused) return p;
        return Object.assign({},p,{timeLeft:Math.max(0,Math.round((p.timeLeft-0.25)*100)/100)});
      });
    },250);
    return function(){ clearInterval(iv); };
  },[m.phase,m.paused]);

  useEffect(function(){
    if(m.phase==="question"&&m.timeLeft<=0) answer(null);
  },[m.phase,m.timeLeft]);

  useEffect(function(){
    if(m.phase==="question"&&!m.paused&&m.timeLeft>0&&m.timeLeft<=5&&m.timeLeft%1===0) SFX.tick();
  },[m.timeLeft]);

  /* safety net: a team can also reach five characters from the teacher panel */
  useEffect(function(){
    if(m.phase==="victory"||m.phase==="unlock"||m.pendingUnlock) return;
    for(var i=0;i<m.teams.length;i++){
      if(m.teams[i].unlocked.length>=CATS.length){
        SFX.win(); confetti(11000);
        setM(function(p){ return Object.assign({},p,{phase:"victory",winner:i,endedAt:Date.now()}); });
        return;
      }
    }
  },[m.teams,m.phase]);

  /* keyboard: A-D / 1-4 answer, space spins, Enter continues */
  useEffect(function(){
    function onKey(ev){
      var tag=(ev.target&&ev.target.tagName)||"";
      if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
      if(m.paused) return;
      if(m.phase==="question"){
        var k=String(ev.key).toLowerCase();
        var i="abcd".indexOf(k); if(i<0) i="1234".indexOf(k);
        if(i>=0){ ev.preventDefault(); answer(i); }
      } else if(m.phase==="spin"&&(ev.key===" "||ev.key==="Enter")){ ev.preventDefault(); spin(); }
      else if(m.phase==="feedback"&&(ev.key===" "||ev.key==="Enter")){ ev.preventDefault(); cont(); }
      else if(m.phase==="unlock"&&(ev.key===" "||ev.key==="Enter")){ ev.preventDefault(); collect(); }
    }
    window.addEventListener("keydown",onKey);
    return function(){ window.removeEventListener("keydown",onKey); };
  },[m,rot,spinning]);

  function resolveAnswer(p,pick){
    var q=p.q, ok=(pick!==null&&pick===q.a);
    var teams=clone(p.teams), tm=teams[p.turn], gained=0, unlock=null;
    if(ok){
      gained=POINTS[q.dif]||100; tm.score+=gained; tm.hits++;
      if(tm.unlocked.indexOf(q.cat)<0){
        tm.progress[q.cat]=(tm.progress[q.cat]||0)+1;
        if(tm.progress[q.cat]>=p.settings.needed){
          tm.unlocked.push(q.cat); tm.score+=UNLOCK_BONUS; gained+=UNLOCK_BONUS; unlock=q.cat;
        }
      }
    } else { tm.misses++; }
    var log=p.log.slice(0,59);
    log.unshift({team:tm.name,color:tm.color,cat:q.cat,ok:ok,timeout:pick===null,q:q.q,picked:pick});
    return Object.assign({},p,{phase:"feedback",teams:teams,pick:pick,ok:ok,gained:gained,
      pendingUnlock:unlock,log:log});
  }
  function answer(pick){
    if(m.phase!=="question") return;
    var next=resolveAnswer(m,pick);
    if(next.ok) SFX.good(); else SFX.bad();
    setM(next);
  }
  function cont(){
    SFX.click();
    if(m.pendingUnlock){ SFX.unlock(); confetti(2800); setM(Object.assign({},m,{phase:"unlock"})); return; }
    nextTurn();
  }
  function collect(){
    SFX.click();
    var tm=m.teams[m.turn];
    if(tm.unlocked.length>=CATS.length){
      SFX.win(); confetti(11000);
      setM(Object.assign({},m,{phase:"victory",winner:m.turn,pendingUnlock:null,endedAt:Date.now()}));
      return;
    }
    setM(Object.assign({},m,{pendingUnlock:null}));
    later(nextTurn,10);
  }
  function nextTurn(){
    setM(function(p){ return Object.assign({},p,{phase:"spin",turn:(p.turn+1)%p.teams.length,
      q:null,cat:null,pick:null,ok:null,gained:0,pendingUnlock:null,timeLeft:p.settings.timer,recycled:false}); });
  }
  function loadQuestion(catId){
    setM(function(p){
      var pool=poolFor(bank,p.settings).filter(function(q){ return q.cat===catId; });
      if(!pool.length){ return Object.assign({},p,{phase:"spin",cat:null,noPool:true}); }
      var used=p.used||{};
      var avail=pool.filter(function(q){ return !used[q.id]; });
      var recycled=false;
      if(!avail.length){ used=Object.assign({},used); pool.forEach(function(q){ delete used[q.id]; }); avail=pool; recycled=true; }
      var q=avail[Math.floor(Math.random()*avail.length)];
      var order=p.settings.shuffleOpts?shuffle([0,1,2,3]):[0,1,2,3];
      var prepared={id:q.id,cat:q.cat,dif:q.dif,lvl:q.lvl,ref:q.ref||"",topic:q.topic||"",set:q.set||"general",
        q:q.q, o:order.map(function(k){return q.o[k];}), a:order.indexOf(q.a), e:q.e};
      var nu=Object.assign({},used); nu[q.id]=1;
      return Object.assign({},p,{phase:"question",q:prepared,used:nu,timeLeft:p.settings.timer,
        pick:null,ok:null,recycled:recycled,noPool:false});
    });
  }
  useEffect(function(){ if(m.noPool){ setToast(T.noQuestions); setM(function(p){return Object.assign({},p,{noPool:false});}); } },[m.noPool]);
  useEffect(function(){ if(m.recycled){ setToast(T.recycled); setM(function(p){return Object.assign({},p,{recycled:false});}); } },[m.recycled]);

  function spin(){
    if(spinning||m.phase!=="spin"||m.paused) return;
    var i=Math.floor(Math.random()*CATS.length);
    var target=(360-(i*72+36)+360)%360;
    var delta=(((target-(rot%360))%360)+360)%360;
    setRot(rot+360*5+delta); setSpinning(true); SFX.spin();
    later(function(){
      setSpinning(false); SFX.land();
      setM(function(p){ return Object.assign({},p,{phase:"reveal",cat:CATS[i].id}); });
      later(function(){ loadQuestion(CATS[i].id); },1400);
    },4700);
  }
  function skip(){ setDrawer(false); nextTurn(); }
  function restart(){
    setDrawer(false);
    setM(function(p){
      var ts=p.teams.map(function(tm){ var n=clone(tm); n.score=0; n.hits=0; n.misses=0; n.unlocked=[]; n.progress={}; return n; });
      return Object.assign({},p,{teams:ts,turn:0,used:{},log:[],phase:"spin",q:null,cat:null,
        pick:null,ok:null,gained:0,pendingUnlock:null,winner:null,timeLeft:p.settings.timer});
    });
  }

  /* ---------- victory ---------- */
  if(m.phase==="victory"){
    var w=m.teams[m.winner];
    var ranked=m.teams.slice().sort(function(a,b){ return (b.unlocked.length-a.unlocked.length)||(b.score-a.score); });
    return html`<div class="wrap victory">
      <div class="trophy">🏆</div>
      <div class="eyebrow">${T.winner}</div>
      <h2 class="winner-name">${w.name}</h2>
      <div class="chip tnum" style=${{fontSize:"17px"}}>${T.finalScore}: ${w.score} ${T.pts}</div>
      <div class="winner-chars">${CATS.map(function(c){ return html`<${CharImg} key=${c.id} cat=${c.id}/>`; })}</div>
      <div class="panel results">
        <div class="eyebrow" style=${{marginBottom:"10px"}}>${T.summary}</div>
        <table><thead><tr>
          <th>${T.team}</th><th>${T.characters}</th><th>${T.hits}</th><th>${T.misses}</th><th style=${{textAlign:"right"}}>${T.score}</th>
        </tr></thead><tbody>
        ${ranked.map(function(tm){ return html`<tr key=${tm.id}>
          <td><span style=${{display:"inline-block",width:"11px",height:"11px",borderRadius:"50%",background:tm.color,marginRight:"8px"}}></span>${tm.name}</td>
          <td>${tm.unlocked.map(function(c){ return html`<span key=${c} class="tag cat" style=${{"--cc":catOf(c).color,marginRight:"4px"}}>${catOf(c).name.slice(0,3)}</span>`; })}
            <span class="muted tnum"> ${tm.unlocked.length}/5</span></td>
          <td class="tnum">${tm.hits}</td><td class="tnum">${tm.misses}</td><td class="num">${tm.score}</td>
        </tr>`; })}
        </tbody></table>
      </div>
      <div class="row" style=${{justifyContent:"center"}}>
        <button class="btn" onClick=${function(){ SFX.click(); restart(); }}>${T.playAgain}</button>
        <button class="btn ghost" onClick=${function(){ SFX.click(); props.onNewGame(); }}>${T.newGame}</button>
      </div>
    </div>`;
  }

  /* ---------- stage content ---------- */
  var stage;
  if(m.phase==="question"||m.phase==="feedback"){
    var q=m.q, c=catOf(q.cat), done=m.phase==="feedback";
    var pct=clamp(m.timeLeft/s.timer*100,0,100);
    stage=html`<div class="qcard">
      <div class="qhead">
        <${CharImg} cat=${q.cat}/>
        <span class="cat" style=${{color:c.color}}>${c.name}</span>
        <span class="badge">${T[q.dif]} · ${POINTS[q.dif]} ${T.pts}</span>
        ${q.topic?html`<span class="badge">${q.topic}</span>`
                 :html`<span class="badge">${levelName(q.lvl)}</span>`}
        ${q.ref?html`<span class="badge">${q.ref}</span>`:null}
      </div>
      <div class="timer-wrap"><div class=${"timer-bar"+(m.timeLeft<=5?" warn":"")} style=${{width:pct+"%"}}></div></div>
      <h2 class="qtext">${q.q}</h2>
      <div class="opts">
        ${q.o.map(function(txt,i){
          var cls="opt";
          if(done){
            if(i===q.a) cls+=" correct";
            else if(i===m.pick) cls+=" wrong";
            else cls+=" dim";
          }
          return html`<button key=${i} class=${cls} disabled=${done||m.paused}
            onClick=${function(){ answer(i); }}>
            <span class="key">${"ABCD".charAt(i)}</span><span>${txt}</span></button>`;
        })}
      </div>
      ${done?html`<div class=${"verdict "+(m.ok?"ok":"no")}>
          <span class="big">${m.ok?T.correct:(m.pick===null?T.timeup:T.incorrect)}</span>
          ${m.ok?html`<span class="chip tnum">+${m.gained} ${T.pts}</span>`:null}
        </div>
        <div class="panel tight explain">
          ${!m.ok?html`<b>${T.answerWas}: ${"ABCD".charAt(q.a)}. ${q.o[q.a]}</b><br/>`:null}
          ${q.e}
          ${m.ok&&!m.pendingUnlock&&team.unlocked.indexOf(q.cat)>=0?html`<div class="muted" style=${{marginTop:"6px",fontSize:"13px"}}>${T.already}</div>`:null}
        </div>
        <button class="btn block" onClick=${cont}>${m.pendingUnlock?T.collect:T.next}</button>`:null}
    </div>`;
  } else if(m.phase==="reveal"){
    var rc=catOf(m.cat);
    stage=html`<div style=${{display:"flex",flexDirection:"column",alignItems:"center",gap:"18px"}}>
      <${Wheel} rot=${rot} spinning=${false} disabled=${true} onSpin=${function(){}}/>
      <div class="cat-reveal"><${CharImg} cat=${m.cat}/>
        <span class="nm" style=${{color:rc.color}}>${rc.name}</span></div>
    </div>`;
  } else {
    stage=html`<${Wheel} rot=${rot} spinning=${spinning} disabled=${m.paused} onSpin=${spin}/>`;
  }

  return html`<div class="wrap">
    <div class="topbar">
      <span class="brand">SOCIAL STUDIES CHAMPIONS</span>
      <span class="spacer"></span>
      ${m.paused?html`<span class="chip" style=${{color:"var(--gold)"}}>⏸ ${T.paused}</span>`:null}
      <button class="icon-btn" title=${T.sound} onClick=${function(){ soundOn=!soundOn; props.onSound(soundOn); }}>
        ${props.soundOn?"🔊":"🔇"}</button>
      <button class="icon-btn" title=${T.teacher} onClick=${function(){ SFX.click(); setDrawer(true); }}>⚙</button>
    </div>
    <div class="turn-banner" style=${{"--tc":team.color}}>
      <span><span class="lbl">${T.turn}</span><br/><span class="who">${team.name}</span></span>
      <span class="spacer"></span>
      <span class="chip tnum">${T.score}: ${team.score}</span>
      <span class="chip tnum">${team.unlocked.length}/5 ★</span>
    </div>
    <div class="board">
      <div class="stage">${stage}</div>
      <div class="rail">
        ${m.teams.map(function(tm,i){ return html`<${TeamCard} key=${tm.id} team=${tm} settings=${s} active=${i===m.turn}/>`; })}
      </div>
    </div>
    ${m.phase==="unlock"&&m.pendingUnlock?html`<div class="overlay">
      <div class="rays"></div>
      <div class="unlock-card">
        <div class="eyebrow" style=${{fontSize:"14px"}}>${T.unlocked}</div>
        <${CharImg} cat=${m.pendingUnlock}/>
        <h2 style=${{fontFamily:"var(--f-display)",fontSize:"clamp(20px,4vw,34px)",color:catOf(m.pendingUnlock).color}}>
          ${catOf(m.pendingUnlock).name}</h2>
        <div class="chip tnum">${team.name} · +${UNLOCK_BONUS} ${T.pts}</div>
        <button class="btn" onClick=${collect}>${T.collect}</button>
      </div></div>`:null}
    ${drawer?html`<${Drawer} match=${m} setMatch=${setM} soundOn=${props.soundOn}
      onClose=${function(){setDrawer(false);}} onSkip=${skip} onRestart=${restart}
      onExit=${props.onExit} onSound=${props.onSound}/>`:null}
    ${toast?html`<${Toast} msg=${toast} onDone=${function(){setToast(null);}}/>`:null}
  </div>`;
}

/* ============================ setup ============================ */
function Setup(props){
  var bank=props.bank;
  var cs=useState(clone(props.settings)), cfg=cs[0], setCfg=cs[1];
  function patch(k,v){ setCfg(function(p){ var n=Object.assign({},p); n[k]=v; return n; }); }
  function setCount(n){
    setCfg(function(p){
      var ts=p.teams.slice(0,n);
      while(ts.length<n) ts.push({name:"Team "+(ts.length+1),color:TEAM_COLORS[ts.length]});
      return Object.assign({},p,{teams:ts});
    });
  }
  function setTeam(i,k,v){ setCfg(function(p){ var ts=clone(p.teams); ts[i][k]=v; return Object.assign({},p,{teams:ts}); }); }
  var pool=useMemo(function(){ return poolFor(bank,cfg); },[bank,cfg.set,cfg.level,cfg.difficulty]);
  var perCat=CATS.map(function(c){ return {c:c,n:pool.filter(function(q){return q.cat===c.id;}).length}; });
  var thin=perCat.some(function(x){ return x.n<cfg.needed*2; });
  return html`<div class="wrap" style=${{paddingBottom:"40px"}}>
    <div class="topbar">
      <button class="btn sm ghost" onClick=${function(){ SFX.click(); props.go("home"); }}>← ${T.backHome}</button>
      <span class="spacer"></span><span class="brand">${T.setup}</span>
    </div>
    <div class="panel" style=${{marginBottom:"16px"}}>
      <div class="field"><span class="label">${T.numTeams}</span>
        <${Seg} value=${cfg.teams.length} onChange=${setCount}
          items=${[2,3,4].map(function(n){return {v:n,l:n+" "+T.howManyTeams};})}/></div>
      <div style=${{display:"grid",gap:"10px",marginTop:"14px"}}>
        ${cfg.teams.map(function(tm,i){ return html`<div key=${i} class="team-setup" style=${{borderColor:tm.color}}>
          <div class="field"><span class="label">${T.teamName} ${i+1}</span>
            <input type="text" id=${"team-name-"+i} value=${tm.name} maxLength="22"
              onChange=${function(e){ setTeam(i,"name",e.target.value); }}/></div>
          <div class="field" style=${{flex:"2 1 240px"}}><span class="label">${T.color}</span>
            <div class="swatches">${TEAM_COLORS.map(function(col){
              return html`<button key=${col} class="swatch" style=${{background:col}} aria-label=${col}
                aria-pressed=${String(tm.color===col)} onClick=${function(){ SFX.click(); setTeam(i,"color",col); }}></button>`;
            })}</div></div>
        </div>`; })}
      </div>
    </div>
    <div class="panel grid2" style=${{marginBottom:"16px"}}>
      <div class="field"><span class="label">${T.set}</span>
        <${Seg} value=${cfg.set} onChange=${function(v){patch("set",v);}}
          items=${[{v:"wwi",l:SET_BY_ID.wwi.name},{v:"unit",l:SET_BY_ID.unit.name},
                   {v:"general",l:SET_BY_ID.general.name},{v:"all",l:T.setAll}]}/></div>
      <div class="field"><span class="label">${T.level}</span>
        <${Seg} value=${cfg.level} onChange=${function(v){patch("level",v);}}
          items=${LEVELS.map(function(l){return {v:l.id,l:l.name};})}/>
        <span class="muted" style=${{fontSize:"12.5px"}}>${T.levelHint}</span></div>
      <div class="field"><span class="label">${T.difficulty}</span>
        <${Seg} value=${cfg.difficulty} onChange=${function(v){patch("difficulty",v);}}
          items=${[{v:"easy",l:T.easy},{v:"medium",l:T.medium},{v:"hard",l:T.hard},{v:"mixed",l:T.mixed}]}/></div>
      <div class="field"><span class="label">${T.timeLimit}</span>
        <${Seg} value=${cfg.timer} onChange=${function(v){patch("timer",v);}}
          items=${[15,20,30,45,60].map(function(v){return {v:v,l:v+" "+T.sec};})}/></div>
      <div class="field"><span class="label">${T.needed}</span>
        <${Seg} value=${cfg.needed} onChange=${function(v){patch("needed",v);}}
          items=${[1,2,3].map(function(v){return {v:v,l:String(v)};})}/></div>
      <div class="field"><span class="label">${T.options}</span>
        <${Seg} value=${cfg.shuffleOpts} onChange=${function(v){patch("shuffleOpts",v);}}
          items=${[{v:true,l:T.shuffleOpts},{v:false,l:"A·B·C·D"}]}/></div>
    </div>
    <div class="panel" style=${{marginBottom:"16px"}}>
      <div class="eyebrow">${pool.length} ${T.available}</div>
      <div class="row" style=${{marginTop:"10px"}}>
        ${perCat.map(function(x){ return html`<span key=${x.c.id} class="tag cat" style=${{"--cc":x.c.color}}>
          ${x.c.name}: ${x.n}</span>`; })}
      </div>
      ${thin?html`<p class="muted" style=${{marginTop:"10px",fontSize:"13px"}}>⚠ ${T.shortBank}</p>`:null}
    </div>
    <button class="btn block" disabled=${pool.length===0}
      onClick=${function(){ SFX.click(); props.onStart(cfg); }}>${T.startMatch}</button>
  </div>`;
}

/* ============================ question bank ============================ */
function QForm(props){
  var st=useState(props.value), v=st[0], setV=st[1];
  function p(k,val){ setV(function(o){ var n=clone(o); n[k]=val; return n; }); }
  function po(i,val){ setV(function(o){ var n=clone(o); n.o[i]=val; return n; }); }
  var valid=String(v.q).trim()&&v.o.every(function(x){return String(x).trim();});
  return html`<div class="panel" style=${{marginBottom:"14px",borderColor:"var(--gold)"}}>
    <div class="grid2">
      <div class="field"><span class="label">${T.category}</span>
        <${Seg} value=${v.cat} onChange=${function(x){p("cat",x);}} items=${CATS.map(function(c){return {v:c.id,l:c.name};})}/></div>
      <div class="field"><span class="label">${T.level}</span>
        <${Seg} value=${v.lvl} onChange=${function(x){p("lvl",x);}} items=${LEVELS.map(function(l){return {v:l.id,l:l.name};})}/></div>
      <div class="field"><span class="label">${T.difficulty}</span>
        <${Seg} value=${v.dif} onChange=${function(x){p("dif",x);}} items=${DIFFS.map(function(d){return {v:d,l:T[d]};})}/></div>
      <div class="field"><span class="label">${T.answer}</span>
        <${Seg} value=${v.a} onChange=${function(x){p("a",x);}} items=${[0,1,2,3].map(function(i){return {v:i,l:"ABCD".charAt(i)};})}/></div>
    </div>
    <div class="field" style=${{marginTop:"14px"}}><span class="label">${T.question}</span>
      <input type="text" id="qf-q" value=${v.q} onChange=${function(e){ p("q",e.target.value); }}/></div>
    <div class="field" style=${{marginTop:"14px"}}><span class="label">${T.options}</span>
      ${[0,1,2,3].map(function(i){ return html`<div key=${i} class="row" style=${{gap:"8px",marginBottom:"6px"}}>
        <span style=${{width:"30px",height:"30px",display:"grid",placeItems:"center",borderRadius:"8px",
          background:v.a===i?"var(--good)":"rgba(255,255,255,.14)",fontWeight:900,fontSize:"13px",flex:"0 0 auto"}}>${"ABCD".charAt(i)}</span>
        <input type="text" id=${"qf-o-"+i} value=${v.o[i]} onChange=${function(e){ po(i,e.target.value); }}/></div>`; })}
    </div>
    <div class="field" style=${{marginTop:"14px"}}><span class="label">${T.explanation}</span>
      <input type="text" id="qf-e" value=${v.e} onChange=${function(e){ p("e",e.target.value); }}/></div>
    <div class="row" style=${{marginTop:"16px"}}>
      <button class="btn sm" disabled=${!valid} onClick=${function(){ SFX.click(); props.onSave(v); }}>${T.save}</button>
      <button class="btn sm ghost" onClick=${function(){ SFX.click(); props.onCancel(); }}>${T.cancel}</button>
    </div>
  </div>`;
}

function Bank(props){
  var bank=props.bank, setBank=props.setBank;
  var f=useState({cat:"all",lvl:"all",dif:"all",set:"all",q:""}), flt=f[0], setFlt=f[1];
  var e=useState(null), editing=e[0], setEditing=e[1];
  var io=useState(null), ioMode=io[0], setIoMode=io[1];
  var tx=useState(""), text=tx[0], setText=tx[1];
  var ts=useState(null), toast=ts[0], setToast=ts[1];
  var fm=useState("json"), fmt=fm[0], setFmt=fm[1];
  function patch(k,v){ setFlt(function(p){ var n=Object.assign({},p); n[k]=v; return n; }); }
  var list=useMemo(function(){
    var needle=flt.q.trim().toLowerCase();
    return bank.filter(function(q){
      if(flt.cat!=="all"&&q.cat!==flt.cat) return false;
      if(flt.lvl!=="all"&&q.lvl!==flt.lvl) return false;
      if(flt.dif!=="all"&&q.dif!==flt.dif) return false;
      if(flt.set!=="all"&&(q.set||"general")!==flt.set) return false;
      if(needle){
        var hay=(q.q+" "+q.o.join(" ")+" "+(q.ref||"")+" "+(q.topic||"")).toLowerCase();
        if(hay.indexOf(needle)<0) return false;
      }
      return true;
    });
  },[bank,flt]);
  function save(v){
    var n=normalize(v); if(!n){ setToast(T.badData); return; }
    setBank(function(b){
      if(v.id){ return b.map(function(q){ return q.id===v.id?Object.assign(n,{id:v.id,set:q.set,ref:q.ref,topic:q.topic}):q; }); }
      return b.concat([Object.assign(n,{id:uid(),set:"custom"})]);
    });
    setEditing(null); setToast(T.saved);
  }
  function del(id){ setBank(function(b){ return b.filter(function(q){ return q.id!==id; }); }); }
  function blank(){ return {cat:"history",lvl:"8",dif:"easy",q:"",o:["","","",""],a:0,e:""}; }
  function doExport(kind){ setFmt(kind); setIoMode("export"); setText(kind==="json"?JSON.stringify(bank,null,1):toCSV(bank)); }
  function doImport(replace){
    var parsed;
    try{ parsed=parseImport(text); }catch(err){ parsed=null; }
    if(!parsed||!parsed.length){ setToast(T.badData); return; }
    setBank(function(b){ return replace?parsed:b.concat(parsed); });
    setToast(parsed.length+" "+T.imported); setIoMode(null); setText("");
  }
  function selectArea(){ var a=document.getElementById("io-area"); if(a){ a.focus(); a.select(); } }
  function copyOut(){
    try{
      navigator.clipboard.writeText(text).then(function(){ setToast(T.copied); },function(){ selectArea(); });
    }catch(err){ selectArea(); }
  }
  return html`<div class="wrap" style=${{paddingBottom:"40px"}}>
    <div class="topbar">
      <button class="btn sm ghost" onClick=${function(){ SFX.click(); props.go("home"); }}>← ${T.backHome}</button>
      <span class="spacer"></span><span class="brand">${T.bank}</span>
    </div>
    <div class="panel">
      <div class="toolbar">
        <div class="field"><span class="label">${T.search}</span>
          <input type="text" id="bank-search" value=${flt.q} placeholder="…" onChange=${function(ev){patch("q",ev.target.value);}}/></div>
        <div class="field"><span class="label">${T.category}</span>
          <select id="bank-cat" value=${flt.cat} onChange=${function(ev){patch("cat",ev.target.value);}}>
            <option value="all">${T.all}</option>
            ${CATS.map(function(c){ return html`<option key=${c.id} value=${c.id}>${c.name}</option>`; })}
          </select></div>
        <div class="field"><span class="label">${T.set}</span>
          <select id="bank-set" value=${flt.set} onChange=${function(ev){patch("set",ev.target.value);}}>
            <option value="all">${T.all}</option>
            ${SETS.map(function(s){ return html`<option key=${s.id} value=${s.id}>${s.name}</option>`; })}
          </select></div>
        <div class="field"><span class="label">${T.level}</span>
          <select id="bank-lvl" value=${flt.lvl} onChange=${function(ev){patch("lvl",ev.target.value);}}>
            <option value="all">${T.all}</option>
            ${LEVELS.map(function(l){ return html`<option key=${l.id} value=${l.id}>${l.name}</option>`; })}
          </select></div>
        <div class="field"><span class="label">${T.difficulty}</span>
          <select id="bank-dif" value=${flt.dif} onChange=${function(ev){patch("dif",ev.target.value);}}>
            <option value="all">${T.all}</option>
            ${DIFFS.map(function(d){ return html`<option key=${d} value=${d}>${T[d]}</option>`; })}
          </select></div>
      </div>
      <div class="row" style=${{marginTop:"14px"}}>
        <button class="btn sm" onClick=${function(){ SFX.click(); setEditing(blank()); setIoMode(null); }}>+ ${T.addQ}</button>
        <button class="btn sm ghost" onClick=${function(){ SFX.click(); setIoMode("import"); setText(""); setEditing(null); }}>${T.importT}</button>
        <button class="btn sm ghost" onClick=${function(){ SFX.click(); doExport("json"); setEditing(null); }}>${T.exportT} JSON</button>
        <button class="btn sm ghost" onClick=${function(){ SFX.click(); doExport("csv"); setEditing(null); }}>${T.exportT} CSV</button>
        <button class="btn sm ghost" onClick=${function(){ SFX.click(); setBank(defaultBank()); setToast(T.restoreDefaults); }}>${T.restoreDefaults}</button>
        <span class="spacer"></span><span class="chip tnum">${list.length} / ${bank.length}</span>
      </div>
    </div>

    ${ioMode==="export"?html`<div class="panel" style=${{marginTop:"14px"}}>
      <div class="row between"><span class="eyebrow">${T.exportT} · ${fmt.toUpperCase()}</span>
        <button class="icon-btn" onClick=${function(){setIoMode(null);}} aria-label=${T.close}>✕</button></div>
      <p class="muted" style=${{fontSize:"13px"}}>${T.exportHint}</p>
      <textarea id="io-area" readOnly value=${text}></textarea>
      <div class="row" style=${{marginTop:"10px"}}>
        <button class="btn sm" onClick=${copyOut}>${T.copy}</button>
        <button class="btn sm ghost" onClick=${function(){ doExport(fmt==="json"?"csv":"json"); }}>${fmt==="json"?"CSV":"JSON"}</button>
      </div></div>`:null}

    ${ioMode==="import"?html`<div class="panel" style=${{marginTop:"14px"}}>
      <div class="row between"><span class="eyebrow">${T.importT}</span>
        <button class="icon-btn" onClick=${function(){setIoMode(null);}} aria-label=${T.close}>✕</button></div>
      <p class="muted" style=${{fontSize:"13px"}}>${T.importHint}</p>
      <textarea id="io-area" value=${text} onChange=${function(ev){ setText(ev.target.value); }}></textarea>
      <div class="row" style=${{marginTop:"10px"}}>
        <button class="btn sm" onClick=${function(){ doImport(false); }}>${T.merge}</button>
        <button class="btn sm ghost" onClick=${function(){ doImport(true); }}>${T.replaceAll}</button>
      </div></div>`:null}

    ${editing?html`<${QForm} value=${editing} onSave=${save} onCancel=${function(){setEditing(null);}}/>`:null}

    <div class="bank-list">
      ${list.length?list.map(function(q){
        var c=catOf(q.cat);
        return html`<div key=${q.id} class="qrow" style=${{"--cc":c.color}}>
          <div class="meta">
            <span class="tag cat" style=${{"--cc":c.color}}>${c.name}</span>
            <span class="tag">${(SET_BY_ID[q.set||"general"]||SET_BY_ID.general).short}</span>
            ${q.topic?html`<span class="tag">${q.topic}</span>`:null}
            <span class="tag">${levelName(q.lvl)}</span>
            <span class="tag">${T[q.dif]}</span>
            ${q.ref?html`<span class="tag">${q.ref}</span>`:null}
            <span style=${{flex:1}}></span>
            <button class="btn sm ghost" onClick=${function(){ SFX.click(); setEditing(clone(q)); setIoMode(null); window.scrollTo({top:0,behavior:"smooth"}); }}>${T.edit}</button>
            <button class="btn sm ghost" onClick=${function(){ SFX.click(); del(q.id); }}>${T.del}</button>
          </div>
          <div class="qq">${q.q}</div>
          <div class="ans">${"ABCD".charAt(q.a)}. ${q.o[q.a]}</div>
          <div class="exp">${q.e}</div>
        </div>`;
      }):html`<div class="empty">${T.noQuestions}</div>`}
    </div>
    ${toast?html`<${Toast} msg=${toast} onDone=${function(){setToast(null);}}/>`:null}
  </div>`;
}

/* ============================ app ============================ */
var DEFAULT_SETTINGS={
  teams:[{name:"Team 1",color:TEAM_COLORS[0]},{name:"Team 2",color:TEAM_COLORS[1]}],
  level:"10", difficulty:"mixed", timer:30, needed:2, set:"wwi", shuffleOpts:true
};
function App(){
  var sc=useState("home"), screen=sc[0], setScreen=sc[1];
  var bs=useState(loadBank), bank=bs[0], setBank=bs[1];
  var ss=useState(function(){ return Object.assign({},DEFAULT_SETTINGS,lsGet("ssc.settings",{})); }), settings=ss[0], setSettings=ss[1];
  var ms=useState(function(){
    var saved=lsGet("ssc.match",null);
    if(saved&&saved.teams&&saved.teams.length&&saved.q!==undefined){
      if(saved.phase==="spinning"||saved.phase==="reveal") saved.phase="spin";
      if(saved.q&&typeof saved.q.q!=="string") return null;   /* pre-English save */
      return saved;
    }
    return null;
  }), match=ms[0], setMatch=ms[1];
  var so=useState(true), sound=so[0], setSound=so[1];

  useEffect(function(){ lsSet("ssc.bank",bank); },[bank]);
  useEffect(function(){ lsSet("ssc.settings",settings); },[settings]);
  useEffect(function(){ if(match) lsSet("ssc.match",match); else lsDel("ssc.match"); },[match]);
  useEffect(function(){ document.documentElement.lang="en"; },[]);

  function start(cfg){
    setSettings(cfg);
    var teams=cfg.teams.map(function(tm,i){
      return {id:"t"+i+"_"+Date.now().toString(36),name:(tm.name||("Team "+(i+1))).trim(),
        color:tm.color,score:0,hits:0,misses:0,unlocked:[],progress:{}};
    });
    setMatch({settings:clone(cfg),teams:teams,turn:0,used:{},log:[],phase:"spin",q:null,cat:null,
      pick:null,ok:null,gained:0,pendingUnlock:null,winner:null,paused:false,timeLeft:cfg.timer,
      startedAt:Date.now()});
    setScreen("game");
  }
  function newGame(){ setMatch(null); setScreen("setup"); }
  function exitHome(){ setScreen("home"); }

  var view;
  if(screen==="game"&&match){
    view=html`<${Game} match=${match} setMatch=${setMatch} bank=${bank}
      soundOn=${sound} onSound=${setSound} onExit=${exitHome} onNewGame=${newGame}/>`;
  } else if(screen==="setup"){
    view=html`<${Setup} settings=${settings} bank=${bank} go=${setScreen} onStart=${start}/>`;
  } else if(screen==="howto"){
    view=html`<${HowTo} go=${setScreen}/>`;
  } else if(screen==="bank"){
    view=html`<${Bank} bank=${bank} setBank=${setBank} go=${setScreen}/>`;
  } else {
    view=html`<${Home} go=${setScreen} hasMatch=${!!(match&&match.phase!=="victory")}
      soundOn=${sound} onSound=${setSound}/>`;
  }
  return html`<${React.Fragment}><${Stars}/><div class="app">${view}</div><//>`;
}

var root=ReactDOM.createRoot(document.getElementById("root"));
function boot(){ root.render(html`<${App}/>`); }
if(window.claude&&window.claude.hot&&window.claude.hot.ready){ window.claude.hot.ready(boot); } else { boot(); }
})();
</script>
</body>
